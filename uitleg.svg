<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <linearGradient id="achter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2108"/>
      <stop offset="1" stop-color="#140801"/>
    </linearGradient>
    <linearGradient id="goud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.45" stop-color="#ffcc33"/>
      <stop offset="1" stop-color="#c4860a"/>
    </linearGradient>
    <style>
      .kop { font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .tekst { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #fff; }
      .klein { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 600; fill: #e8cfa0; }
      .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
      .vak { fill: rgba(255,255,255,0.07); stroke: #ffcc33; stroke-width: 3; }
      .doe { fill: #7dff9a; font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    </style>
  </defs>

  <rect width="1600" height="1600" fill="url(#achter)"/>

  <!-- kop met logo -->
  <image href="logo.png" xlink:href="logo.png" x="50" y="40" width="230" height="230"/>
  <text x="320" y="140" class="kop" font-size="100" fill="#2a1200" stroke="#2a1200" stroke-width="22" stroke-linejoin="round">KAAS ROYALE</text>
  <text x="320" y="140" class="kop" font-size="100" fill="url(#goud)">KAAS ROYALE</text>
  <text x="324" y="205" class="tekst" font-size="40">Ren, spring en pak de kaas 🧀  Hoe ver kom jij?</text>
  <text x="324" y="255" class="klein" font-size="34">evelienvegter.github.io/kaas-royale</text>

  <!-- LINKS 1: op je telefoon -->
  <rect x="40" y="310" width="750" height="440" rx="28" class="vak"/>
  <text x="80" y="375" class="kop" font-size="40" fill="#ffd23f">📲 ZET HEM OP JE TELEFOON</text>
  <g class="tekst" font-size="34">
    <text x="80" y="445"><tspan fill="#ffd23f">1</tspan>  Open de link hierboven</text>
    <text x="80" y="505"><tspan fill="#ffd23f">2</tspan>  iPhone: tik op ⬆️ (Deel)</text>
    <text x="118" y="555" class="klein" font-size="30">Android: tik op ⋮ (drie puntjes)</text>
    <text x="80" y="620"><tspan fill="#ffd23f">3</tspan>  Kies <tspan fill="#7dff9a">Zet op beginscherm</tspan></text>
    <text x="80" y="690"><tspan fill="#ffd23f">4</tspan>  Telefoon <tspan fill="#7dff9a">dwars</tspan> 📱↻ en gaan!</text>
  </g>

  <!-- LINKS 2: besturing -->
  <rect x="40" y="780" width="750" height="780" rx="28" class="vak"/>
  <text x="80" y="850" class="kop" font-size="40" fill="#ffd23f">🎮 ZO SPEEL JE</text>
  <g>
    <text x="150" y="1010" class="emoji" font-size="110" text-anchor="middle">👆</text>
    <text x="270" y="955" class="kop" font-size="52" fill="#fff">TIK</text>
    <text x="270" y="1010" class="tekst" font-size="38" fill="#7dff9a">= springen</text>

    <text x="150" y="1250" class="emoji" font-size="80" text-anchor="middle">👆👆</text>
    <text x="270" y="1195" class="kop" font-size="52" fill="#fff">2x TIK</text>
    <text x="270" y="1250" class="tekst" font-size="38" fill="#7dff9a">= extra hoog springen</text>

    <text x="150" y="1480" class="emoji" font-size="110" text-anchor="middle">👇</text>
    <text x="270" y="1425" class="kop" font-size="52" fill="#fff">VEEG OMLAAG</text>
    <text x="270" y="1480" class="tekst" font-size="38" fill="#7dff9a">= bukken</text>
  </g>

  <!-- RECHTS 1: wat doe je bij -->
  <rect x="810" y="310" width="750" height="760" rx="28" class="vak"/>
  <text x="850" y="375" class="kop" font-size="40" fill="#ffd23f">⚠️ WAT DOE JE BIJ...</text>
  <g class="tekst" font-size="34">
    <text x="850" y="455"><tspan class="emoji">🪤</tspan> Muizenval, kist, 💩</text>
    <text x="1520" y="455" text-anchor="end" class="doe" font-size="34">SPRING</text>
    <text x="850" y="535"><tspan class="emoji">🕯️</tspan> Kroonluchter, buis</text>
    <text x="1520" y="535" text-anchor="end" class="doe" font-size="34">BUK</text>
    <text x="850" y="615"><tspan class="emoji">🪵</tspan> Boomstam</text>
    <text x="1520" y="615" text-anchor="end" class="doe" font-size="34">2x SPRING</text>
    <text x="850" y="695"><tspan class="emoji">🕳️</tspan> Klein gat, opstapje</text>
    <text x="1520" y="695" text-anchor="end" class="doe" font-size="34">SPRING</text>
    <text x="850" y="775"><tspan class="emoji">🤸</tspan> Groot gat</text>
    <text x="1520" y="775" text-anchor="end" class="doe" font-size="34">TRAMPOLINE</text>
    <text x="850" y="855"><tspan class="emoji">🦶</tspan> Voet (level 1)</text>
    <text x="850" y="915"><tspan class="emoji">🤡</tspan> Clown (level 2)</text>
    <text x="1520" y="885" text-anchor="end" class="doe" font-size="34">WACHT...</text>
    <text x="1185" y="1020" text-anchor="middle" class="kop" font-size="54" fill="#ffd23f">2…  1…  <tspan fill="#ff5a4d">SPRING!</tspan></text>
  </g>

  <!-- RECHTS 2: pro tips -->
  <rect x="810" y="1100" width="750" height="460" rx="28" class="vak"/>
  <text x="850" y="1170" class="kop" font-size="40" fill="#ffd23f">⭐ PRO TIPS</text>
  <g class="tekst" font-size="33">
    <text x="850" y="1245"><tspan class="emoji">🍭</tspan> Superlolly = 5 sec <tspan fill="#7dff9a">onverslaanbaar</tspan></text>
    <text x="850" y="1315"><tspan class="emoji">🧀</tspan> Snoep 2 punten · gouden kaas 10</text>
    <text x="850" y="1385"><tspan class="emoji">🐀</tspan> Nieuwe ratjes bij 50, 150, 300, 500</text>
    <text x="850" y="1455"><tspan class="emoji">☢️</tspan> 500 punten = <tspan fill="#7dff9a">de put naar level 2</tspan></text>
    <text x="905" y="1505" class="klein" font-size="30">het riool… met poep en een clown 🤡</text>
  </g>
</svg>
