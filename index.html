<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a1606">
<title>Kaas Royale</title>
<meta name="apple-mobile-web-app-title" content="Kaas Royale">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; background: #2a1606; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="spel"></canvas>
<script>
// =====================================================================
//  KAAS ROYALE - versie 14
//  Een ratje rent door een schatkamer vol lekkers.
//  Tik = springen, 2x tikken = hoger springen, veeg omlaag = bukken.
//  Op de computer: spatie of pijltje omhoog = springen, pijltje omlaag = bukken.
// =====================================================================

// ----- Getallen om mee te spelen: verander ze en kijk wat er gebeurt! -----
const INSTELLINGEN = {
  startSnelheid: 260,      // hoe snel het ratje begint (pixels per seconde)
  versnelling: 5,          // hoeveel sneller het elke seconde gaat
  maxSnelheid: 650,        // sneller dan dit wordt het niet
  springKracht: 640,       // hoe hoog je springt
  dubbelSprongKracht: 650, // hoe hoog de tweede sprong in de lucht is
  zwaartekracht: 1800,     // hoe hard je weer naar beneden valt
  bukTijd: 0.8,            // hoeveel seconden je bukt na omlaag vegen
  kansOpGoud: 0.08,        // kans op gouden kaas (0 = nooit, 1 = altijd)
  puntenLekker: 2,         // punten voor elk snoepje
  puntenGoud: 10,          // punten voor gouden kaas
  levelPunten: 500,        // bij zoveel punten komt de put naar level 2
  snoepjeElke: 18,         // om de hoeveel seconden er ongeveer een superlolly komt
  boostDuur: 5,            // hoeveel seconden de superkracht duurt
  boostSnelheid: 1.5,      // hoeveel keer zo snel je gaat met superkracht
  gatKans: 0.18,           // kans dat er een gat met trampoline komt (0 tot 1)
  gatLengte: 1.4,          // hoe lang het gat is (in seconden rennen)
  vliegZwaartekracht: 600, // lager = langer zweven na de trampoline
  kleinGatKans: 0.15,      // kans op een klein gat waar je overheen springt
  boomstamKans: 0.12,      // kans op een boomstam (alleen met 2x springen eroverheen)
  hoogteVerschil: 45,      // hoe hoog een opstapje in de vloer is
  voetElke: 14,            // om de hoeveel seconden de voet (level 1) of de clown (level 2) komt
  voetDuur: 8,             // hoeveel seconden de voet achter je aan zit
  aftellen: 2,             // hoeveel seconden het spel aftelt voordat de voet trapt
};

// ----- De ratjes: bij genoeg punten (je record in dat level) speel je een nieuw ratje vrij -----
const RATJES = [
  { naam: 'Snuf',   nodig: 0,   vacht: '#9b9b9b', buik: '#dcdcdc', roze: '#f2a7b5' },
  { naam: 'Pepper', nodig: 50,  vacht: '#7a4a2a', buik: '#c99f78', roze: '#f2a7b5' },
  { naam: 'Ninja',  nodig: 150, vacht: '#2b2b33', buik: '#55556a', roze: '#f2a7b5', band: '#e02424' },
  { naam: 'Goudje', nodig: 300, vacht: '#d9a520', buik: '#f6dd8a', roze: '#f7b3c0', kroon: true },
  { naam: 'Radio',  nodig: 500, vacht: '#4cff3a', buik: '#b8ff9e', roze: '#c8ff7a', straling: true },
  // ratjes voor level 2 (punten in het riool)
  { naam: 'Poeprat', nodig: 150, level: 2, vacht: '#6b4423', buik: '#a8794c', roze: '#e8a0a8', poep: true },
];

// ----- Het lekkers in de schatkamer -----
const LEKKERS = ['🧀', '🍰', '🍪', '🍩', '🍓', '🧁', '🍫', '🥐', '🍕'];
const SUPERSNOEPJE = '🍭';

// =====================================================================
//  Vanaf hier: de motor van het spel
// =====================================================================
const canvas = document.getElementById('spel');
const ctx = canvas.getContext('2d');
const H = 400;          // het spel is altijd 400 hoog; de breedte past zich aan
const G = H - 70;       // hoogte van de vloer
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
let W = 700, schaal = 1;

function maatAanpassen() {
  const dpr = window.devicePixelRatio || 1;
  const bw = window.innerWidth, bh = window.innerHeight;
  schaal = bh / H;
  W = bw / schaal;
  canvas.width = Math.round(bw * dpr);
  canvas.height = Math.round(bh * dpr);
  ctx.setTransform(schaal * dpr, 0, 0, schaal * dpr, 0, 0);
}
window.addEventListener('resize', maatAanpassen);
maatAanpassen();

// ----- Toestand van het spel -----
let toestand = 'menu';   // 'menu', 'spelen', 'overgang' (naar het volgende level) of 'af'
let level = 1, levelStart = 0, put = null, overgangT = 0, levelGewisseld = false;
let rat, dingen = [], lekkers = [], deeltjes = [], gaten = [];
let snelheid, afstand, score, volgendObstakel, volgendLekker, volgendSnoepje, springBuffer, luchtersGezien;
let gatenGezien, tijdSindsGat, stammenGezien, voetenGezien;
let vloer = [], voet = { actief: false }, voetTimer = 0;
let scrollX = 0, tijd = 0, afSinds = 0, schudden = 0, oorzaak = '', nieuwRecord = false, vrijgespeeld = [];
let melding = '', meldingTijd = 0;
let record = Number(localStorage.getItem('kaasRoyaleRecord')) || 0;      // record in level 1
let record2 = Number(localStorage.getItem('kaasRoyaleRecord2')) || 0;    // record in level 2
let gekozen = Number(localStorage.getItem('kaasRoyaleRatje')) || 0;
const ratLevel = k => k.level || 1;
const recordVan = n => n === 2 ? record2 : record;
const ratOpen = k => recordVan(ratLevel(k)) >= k.nodig;
const VERSIE = 14;
// level 2 blijft open: ook als je record ooit hoog genoeg was
let level2Open = localStorage.getItem('kaasRoyaleLevel2') === '1' || record >= INSTELLINGEN.levelPunten;
// het beginscherm heeft een slide per level; level 2 komt erbij als je hem gehaald hebt
let slide = level2Open && localStorage.getItem('kaasRoyaleStartLevel') === '2' ? 2 : 1;
level = slide;   // het menu laat de achtergrond van dat level zien
if (!RATJES[gekozen] || !ratOpen(RATJES[gekozen])) gekozen = 0;
let omlaagIngedrukt = false, vingerOmlaag = false;

const RAT_X = 140;        // waar het ratje rent

function nieuwSpel() {
  rat = { x: RAT_X, y: G, vy: 0, opGrond: true, dubbel: false, vliegt: false, bukken: 0, fase: 0, boost: 0, onkwetsbaar: 0, coyote: 0 };
  dingen = []; lekkers = []; deeltjes = []; gaten = [];
  snelheid = INSTELLINGEN.startSnelheid;
  afstand = 0; score = 0; springBuffer = 0; luchtersGezien = 0; gatenGezien = 0; tijdSindsGat = 0;
  stammenGezien = 0; voetenGezien = 0;
  vloer = [{ x: -200, w: W + 900, h: 0 }];
  vloerAanvullen();
  voet = { actief: false };
  voetTimer = INSTELLINGEN.voetElke;
  level = 1; levelStart = 0; put = null;
  volgendObstakel = 1.4; volgendLekker = 0.4;
  volgendSnoepje = willekeurig(8, 12);   // de eerste komt wat sneller
  nieuwRecord = false; vrijgespeeld = [];
  toestand = 'spelen';
}

const willekeurig = (a, b) => a + Math.random() * (b - a);
const kies = lijst => lijst[Math.floor(Math.random() * lijst.length)];
function hash(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

// ----- Geluid (gemaakt met de computer, geen bestanden nodig) -----
let audio = null;
function startAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audio && audio.state === 'suspended') audio.resume();
}
function piep(toon, duur, soort = 'square', volume = 0.07, glijNaar = 0, wacht = 0) {
  if (!audio) return;
  const t = audio.currentTime + wacht;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = soort;
  o.frequency.setValueAtTime(toon, t);
  if (glijNaar) o.frequency.exponentialRampToValueAtTime(glijNaar, t + duur);
  g.gain.setValueAtTime(volume, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + duur);
  o.connect(g); g.connect(audio.destination);
  o.start(t); o.stop(t + duur);
}

// ----- Besturing -----
function springen() {
  if (toestand !== 'spelen') return;
  if (rat.opGrond || (rat.coyote > 0 && !rat.vliegt)) {
    rat.vy = -INSTELLINGEN.springKracht;
    rat.opGrond = false;
    rat.coyote = 0;
    rat.dubbel = false;
    rat.bukken = 0;
    piep(320, 0.15, 'square', 0.05, 640);
  } else if (!rat.dubbel) {
    // tweede tik in de lucht: nog een keer omhoog
    rat.vy = -INSTELLINGEN.dubbelSprongKracht;
    rat.dubbel = true;
    rat.bukken = 0;
    piep(480, 0.15, 'square', 0.05, 960);
    for (let i = 0; i < 6; i++) deeltjes.push({ x: rat.x - 5, y: rat.y, vx: willekeurig(-90, 90), vy: willekeurig(20, 90), leven: 0.35, wolkje: true });
  } else {
    springBuffer = 0.12; // net te vroeg getikt? dan springt hij zodra hij landt
  }
}
function bukken() {
  if (toestand !== 'spelen') return;
  rat.bukken = INSTELLINGEN.bukTijd;
  if (!rat.opGrond && !rat.vliegt) rat.vy = Math.max(rat.vy, 700); // snel naar beneden
  piep(220, 0.1, 'triangle', 0.05, 140);
}

// Welk vakje in het menu hoort bij deze plek?
// Welke ratjes staan op deze slide? Op slide 1 de ratjes van level 1, op slide 2 allemaal
function slideRatjes(n = slide) { return RATJES.filter(k => n === 2 || ratLevel(k) === 1); }
function menuVakje(x) {
  const lijst = slideRatjes();
  return Math.max(0, Math.min(lijst.length - 1, Math.floor(x / (W / lijst.length))));
}
// Naar de andere slide van het beginscherm
const PIJL_Y = 142;
function naarSlide(n) {
  if (!level2Open || n < 1 || n > 2 || n === slide) return;
  slide = n;
  level = n;
  localStorage.setItem('kaasRoyaleStartLevel', String(n));
  piep(n === 2 ? 330 : 520, 0.1, 'triangle', 0.06);
}
function tikBuitenSpel(x, y = H) {
  startAudio();
  if (toestand === 'menu') {
    // tik op een pijltje bij de naam van het level
    if (level2Open && Math.abs(y - PIJL_Y) < 26) {
      if (x < W / 2 - 120) { naarSlide(1); return; }
      if (x > W / 2 + 120) { naarSlide(2); return; }
    }
    const lijst = slideRatjes(), k = lijst[menuVakje(x)];
    if (ratOpen(k)) {
      gekozen = RATJES.indexOf(k);
      localStorage.setItem('kaasRoyaleRatje', String(gekozen));
      nieuwSpel();
      if (slide === 2) startLevel2();
    } else {
      melding = '🔒 ' + k.naam + ': haal eerst ' + k.nodig + ' punten in level ' + ratLevel(k);
      meldingTijd = 2.2;
      piep(180, 0.15, 'square', 0.05);
    }
  } else if (toestand === 'af' && afSinds > 0.7) {
    toestand = 'menu';
    level = slide;
  }
}

let veegStartY = null, geveegd = false, menuStart = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  startAudio();
  const t = e.changedTouches[0];
  if (toestand !== 'spelen') { menuStart = { x: t.clientX / schaal, y: t.clientY / schaal }; veegStartY = null; return; }
  veegStartY = t.clientY; geveegd = false;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (veegStartY === null || geveegd) return;
  if (e.changedTouches[0].clientY - veegStartY > 20) { geveegd = true; vingerOmlaag = true; bukken(); }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (menuStart && toestand !== 'spelen') {
    const t = e.changedTouches[0], dx = t.clientX / schaal - menuStart.x;
    if (toestand === 'menu' && Math.abs(dx) > 60) naarSlide(dx < 0 ? slide + 1 : slide - 1);   // vegen = andere slide
    else tikBuitenSpel(menuStart.x, menuStart.y);
    menuStart = null;
    return;
  }
  menuStart = null;
  if (veegStartY !== null && !geveegd) springen();
  veegStartY = null; vingerOmlaag = false;
}, { passive: false });
canvas.addEventListener('mousedown', e => {
  if (toestand !== 'spelen') tikBuitenSpel(e.clientX / schaal, e.clientY / schaal); else springen();
});
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (toestand !== 'spelen') {
    const cijfer = Number(e.key);
    const n = slideRatjes().length;
    if (toestand === 'menu' && e.code === 'ArrowLeft') { naarSlide(slide - 1); return; }
    if (toestand === 'menu' && e.code === 'ArrowRight') { naarSlide(slide + 1); return; }
    if (cijfer >= 1 && cijfer <= n) tikBuitenSpel((cijfer - 0.5) * W / n);
    else if (e.code === 'Space' || e.code === 'Enter') tikBuitenSpel((Math.max(0, slideRatjes().indexOf(RATJES[gekozen])) + 0.5) * W / n);
    return;
  }
  if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) springen();
  if (e.code === 'ArrowDown') { if (!omlaagIngedrukt) bukken(); omlaagIngedrukt = true; }
});
window.addEventListener('keyup', e => { if (e.code === 'ArrowDown') omlaagIngedrukt = false; });

// ----- De vloer: stukken met verschillende hoogtes -----
function vloerHoogte(x) {
  for (const s of vloer) if (x >= s.x && x < s.x + s.w) return s.h;
  return 0;
}
function vloerY(x) { return G - vloerHoogte(x); }
function levelAfstand() { return level === 1 ? afstand : afstand - levelStart + 2500; }
function grondY(x) { return boveGat(x) ? Infinity : vloerY(x); }

// Maakt steeds nieuwe stukken vloer, ver buiten beeld
function vloerAanvullen() {
  const stap = INSTELLINGEN.hoogteVerschil;
  let laatste = vloer[vloer.length - 1];
  while (laatste.x + laatste.w < W + 1600) {
    let h = 0;
    if (levelAfstand() + laatste.x > 2000 && Math.random() < 0.75) {
      h = kies([0, stap, stap * 2].filter(k => k <= laatste.h + stap)); // nooit meer dan 1 opstapje omhoog
    }
    laatste = { x: laatste.x + laatste.w, w: willekeurig(450, 1000), h };
    vloer.push(laatste);
  }
}
function knipVloer(x) {
  const i = vloer.findIndex(s => x > s.x && x < s.x + s.w);
  if (i < 0) return;
  const s = vloer[i];
  vloer.splice(i + 1, 0, { x, w: s.x + s.w - x, h: s.h });
  s.w = x - s.x;
}
// Maakt de vloer van x1 tot x2 vlak (voor obstakels en gaten) en geeft de hoogte terug (als y)
function maakVlak(x1, x2) {
  const h = vloerHoogte(x1);
  knipVloer(x1); knipVloer(x2);
  vloer.forEach(s => { if (s.x >= x1 && s.x < x2) s.h = h; });
  for (let i = 1; i < vloer.length; i++) {
    const max = vloer[i - 1].h + INSTELLINGEN.hoogteVerschil;
    if (vloer[i].x >= x2 && vloer[i].h > max) vloer[i].h = max;
  }
  return G - h;
}

// ----- Obstakels en lekkers maken -----
const NIEUW_X = () => W + 120;   // nieuwe dingen beginnen hier, net buiten beeld

function maakObstakel(soort) {
  const x = NIEUW_X();
  if (!soort) soort = kies(['val', 'val', 'kist', 'kist', 'luchter']);
  let o;
  if (soort === 'val') o = { soort, x, w: 52, h: 22 };
  else if (soort === 'kist') o = { soort, x, w: 46, h: 40 };
  if (soort === 'val' && level === 2) o = { soort, x, w: 44, h: 24 };   // de drol is iets smaller
  else if (soort === 'luchter') o = { soort, x, w: 62, h: 0, nummer: ++luchtersGezien };
  else o = { soort: 'stam', x, w: 108, h: 108, r: 54, nummer: ++stammenGezien };
  o.v = maakVlak(W + 5, x + o.w + 240);   // vlak tot een stuk na het obstakel, zodat je eerst kunt landen
  dingen.push(o);
  const v = o.v;

  // Een boogje lekkers als beloning voor wie goed springt of bukt
  if (o.soort === 'luchter') {
    for (let i = 0; i < 3; i++) maakLekker(x + 6 + i * 25, v - 12);
  } else if (o.soort === 'stam') {
    volgendObstakel = willekeurig(1.7, 2.3); // ruimte om te landen
    maakLekker(x + o.w / 2 - 30, v - o.h - 55);
    maakLekker(x + o.w / 2 + 30, v - o.h - 55);
  } else if (Math.random() < 0.6) {
    maakLekker(x - 50, v - 70);
    maakLekker(x + o.w / 2, v - 120);
    maakLekker(x + o.w + 50, v - 70);
  }
}

// Een klein gat in de vloer: daar spring je gewoon overheen
function maakKleinGat() {
  const x = NIEUW_X();
  const w = Math.max(100, snelheid * 0.4);
  const v = maakVlak(W + 5, x + w + 160);
  gaten.push({ x, w, v, trampX: null });
  volgendObstakel = (w + 320) / snelheid;
  maakLekker(x + 10, v - 70);
  maakLekker(x + w / 2, v - 105);
  maakLekker(x + w - 10, v - 70);
}

// Een groot gat in de vloer, met ervoor een trampoline die je eroverheen lanceert
function maakGat() {
  const trampX = NIEUW_X(), trampW = 56;
  const x = trampX + trampW + 40;
  const w = snelheid * INSTELLINGEN.gatLengte;
  const v = maakVlak(W + 5, x + w + 260);
  gaten.push({ x, w, v, trampX, trampW, indruk: 0, nummer: ++gatenGezien });
  tijdSindsGat = 0;
  volgendObstakel = (trampW + 40 + w + 420) / snelheid;

  // Een boog lekkers precies langs de vliegroute
  const start = trampX - 32;
  const T = (x + w + 60 - start) / snelheid;
  const vy = INSTELLINGEN.vliegZwaartekracht * T / 2;
  for (let k = 1; k <= 7; k++) {
    const t = T * k / 8;
    const hoogte = vy * t - INSTELLINGEN.vliegZwaartekracht * t * t / 2;
    maakLekker(start + 30 + snelheid * t, v - 22 - hoogte);
  }
}
function boveGat(x) {
  if (rat && rat.boost > 0) return false; // met superkracht ren je over een regenboog
  return gaten.some(g => x > g.x + 4 && x < g.x + g.w - 4);
}

// ----- Einde van level 1: de put naar het riool -----
function maakPut() {
  // pas na alles wat er al aankomt
  let x = W + 400;
  dingen.forEach(o => { x = Math.max(x, o.x + o.w + 350); });
  gaten.forEach(g => { x = Math.max(x, g.x + g.w + 350); });
  const vanaf = Math.max(W + 5, x - 250);
  put = { x, v: maakVlak(vanaf, x + 700) };
  volgendObstakel = 999;
  voetTimer = 999;
  if (voet.actief) voet.fase = 'gaat';
}
function startLevel2() {
  if (level === 1 && toestand === 'overgang') bewaarRecord();   // je punten van level 1 tellen voor je record
  level = 2;
  score = 0;   // in level 2 beginnen de punten opnieuw
  if (!level2Open) { level2Open = true; localStorage.setItem('kaasRoyaleLevel2', '1'); }
  levelStart = afstand;
  put = null;
  dingen = []; lekkers = []; gaten = []; deeltjes = [];
  vloer = [{ x: -200, w: W + 900, h: 0 }];
  vloerAanvullen();
  rat.x = RAT_X; rat.y = G; rat.vy = 0; rat.opGrond = true; rat.vliegt = false; rat.dubbel = false; rat.bukken = 0;
  snelheid = Math.max(INSTELLINGEN.startSnelheid + 40, snelheid * 0.85);
  volgendObstakel = 1.6; volgendLekker = 0.3; tijdSindsGat = 0;
  voet = { actief: false };
  voetTimer = INSTELLINGEN.voetElke;
}

// ----- De grote voet -----
const VOET_B = 120;   // hoe lang de schoen is
function voetRust() { return rat.x - 60 - VOET_B; }
function toeter() {   // de toeter van de clown: toet-toet!
  piep(420, 0.12, 'square', 0.07, 360);
  piep(420, 0.16, 'square', 0.07, 340, 0.17);
}
function startVoet() {
  // in level 1 de grote voet, in het riool de clown met zijn rode ballon
  const soort = level === 2 ? 'clown' : 'voet';
  voet = { actief: true, soort, tijd: INSTELLINGEN.voetDuur, x: -VOET_B - 80, fase: 'komt', t: 0, volgende: 1.6, nummer: ++voetenGezien };
  if (soort === 'clown') {
    deeltjes.push({ x: W / 2, y: 120, vy: 0, leven: 1.6, tekst: 'DE CLOWN KOMT! 🎈', groot: true });
    toeter();
  } else {
    deeltjes.push({ x: W / 2, y: 120, vy: 0, leven: 1.6, tekst: 'DE VOET KOMT! 🦶', groot: true });
    piep(90, 0.5, 'sawtooth', 0.08, 60);
  }
}
// De voet trapt alleen als er verder niets aankomt, anders is het niet eerlijk

// ----- Bijwerken, elk beeldje opnieuw -----
function bijwerken(dt) {
  tijd += dt;
  schudden = Math.max(0, schudden - dt);
  meldingTijd = Math.max(0, meldingTijd - dt);
  deeltjes.forEach(d => { d.y += d.vy * dt; d.x += (d.vx || 0) * dt; d.leven -= dt; });

  if (toestand === 'menu') { scrollX += 40 * dt; return; }

    overgangT += dt;

    if (overgangT >= 1 && !levelGewisseld) { levelGewisseld = true; startLevel2(); }
    if (overgangT >= 2.4) toestand = 'spelen';

  }
  if (toestand === 'af') { afSinds += dt; return; }

    if (Math.random() < 0.6) deeltjes.push({ x: rat.x - 20, y: rat.y - willekeurig(5, 35), vx: -200, vy: willekeurig(-30, 30), leven: 0.4, regenboog: true });
    if (rat.boost <= 0) { rat.boost = 0; rat.onkwetsbaar = 1.2; piep(600, 0.3, 'triangle', 0.06, 300); }
  }
  rat.onkwetsbaar = Math.max(0, rat.onkwetsbaar - dt);

  // Het ratje
  const vorigeY = rat.y;
  rat.vy += (rat.vliegt ? INSTELLINGEN.vliegZwaartekracht : INSTELLINGEN.zwaartekracht) * dt;
  rat.y += rat.vy * dt;
  if (rat.opGrond) rat.coyote = 0.1;   // net van een randje af? dan mag je nog even springen
  rat.coyote = Math.max(0, rat.coyote - dt);

  const steun = Math.min(grondY(rat.x - 10), grondY(rat.x + 30));
  // landen kan alleen als je vlak hiervoor nog boven de vloer was (anders zit je al in een gat)
  if (rat.y >= steun && vorigeY <= steun + 2) {
    rat.y = steun; rat.vy = 0; rat.opGrond = true; rat.dubbel = false; rat.vliegt = false;
    if (springBuffer > 0) { springBuffer = 0; springen(); }
  }
  if (rat.y > H + 40) { af('gat'); return; }

  // Tegen een opstapje aan gelopen?
  const voorX = rat.x + 38;
  if (!boveGat(voorX) && vloerY(voorX) < rat.y - 4) {
    const bijnaBoven = rat.y - vloerY(voorX) <= 24 && rat.vy >= 0;   // net te laag geland? dan klautert hij erop
    if (rat.boost > 0 || rat.onkwetsbaar > 0 || bijnaBoven) {

    if (opTrampoline && rat.vy >= 0 && rat.y >= g.v - 20 && !rat.vliegt) {

  rat.bukken = Math.max(0, rat.bukken - dt);
  if (rat.opGrond) rat.fase += dx / 14;

  // Nieuwe dingen maken
  tijdSindsGat += dt;

  if (voet.actief && (voet.wacht || ['aftellen', 'aanloop', 'trap'].includes(voet.fase))) volgendObstakel = Math.max(volgendObstakel, 0.4);

  if (volgendObstakel <= 0) {

    const r = Math.random(), I = INSTELLINGEN, la = levelAfstand();

    else if (la > 1200 && r < I.gatKans + I.kleinGatKans) maakKleinGat();

  for (const o of dingen) {

  }

}

function tekenSchatkamer() {
  const lucht = ctx.createLinearGradient(0, 0, 0, G);
  lucht.addColorStop(0, '#1f0f04');
  lucht.addColorStop(1, '#4a2a0e');
  ctx.fillStyle = lucht;
  ctx.fillRect(0, 0, W, G);

  // Pilaren met fakkels (bewegen langzaam: ver weg)
  const p = scrollX * 0.35, tussen = 260;
  for (let i = Math.floor(p / tussen) - 1; i * tussen - p < W + tussen; i++) {
    const x = i * tussen - p;
    ctx.fillStyle = '#3a200b';
    ctx.fillRect(x, 30, 42, G - 30);
    ctx.fillStyle = '#4a2a10';
    ctx.fillRect(x + 6, 30, 8, G - 30);
    ctx.fillStyle = '#2c1707';
    ctx.fillRect(x - 6, 22, 54, 14);
    // fakkel
    const fy = 120, fx = x + 21, flakker = Math.sin(tijd * 13 + i) * 2 + Math.sin(tijd * 7 + i * 3) * 1.5;
    const gloed = ctx.createRadialGradient(fx, fy - 10, 2, fx, fy - 10, 70);
    gloed.addColorStop(0, 'rgba(255,190,80,0.35)');
    gloed.addColorStop(1, 'rgba(255,190,80,0)');
    ctx.fillStyle = gloed;
    ctx.fillRect(fx - 70, fy - 80, 140, 140);
    ctx.fillStyle = '#6b4a2a';
    ctx.fillRect(fx - 3, fy, 6, 18);
    ctx.fillStyle = '#ff9a1f';
    ctx.beginPath(); ctx.ellipse(fx, fy - 7, 7, 12 + flakker, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath(); ctx.ellipse(fx, fy - 4, 3.5, 7 + flakker / 2, 0, 0, Math.PI * 2); ctx.fill();
  }

  // Bergen goud (bewegen sneller: dichterbij)
  const q = scrollX * 0.6, tussen2 = 340;
  for (let i = Math.floor(q / tussen2) - 1; i * tussen2 - q < W + tussen2; i++) {
    const x = i * tussen2 - q + hash(i) * 120;
    const w = 60 + hash(i + 50) * 50, h = 30 + hash(i + 90) * 30;
    ctx.fillStyle = '#9c6f0c';
    ctx.beginPath(); ctx.ellipse(x, G, w, h, 0, Math.PI, 0); ctx.fill();
    for (let k = 0; k < 14; k++) {
      const rx = (hash(i * 31 + k) - 0.5) * 1.7;
      const cx = x + rx * w;
      const maxH = h * Math.sqrt(Math.max(0, 1 - rx * rx));
      const cy = G - hash(i * 17 + k) * maxH * 0.9 - 2;
      ctx.fillStyle = k % 3 ? '#e8b923' : '#ffd84d';
      ctx.beginPath(); ctx.ellipse(cx, cy, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    // een edelsteen bovenop
    const kleuren = ['#e0315a', '#2fb7e0', '#3ccf6e', '#a35be8'];
    ctx.fillStyle = kleuren[Math.abs(i) % 4];
    ctx.beginPath();
    ctx.moveTo(x, G - h - 12); ctx.lineTo(x + 8, G - h - 2); ctx.lineTo(x, G - h + 6); ctx.lineTo(x - 8, G - h - 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(x - 2, G - h - 7, 3, 3);
  }

}

function tekenVloer() {

    const y = G - st.h;
    ctx.fillStyle = kleurVloer;
    ctx.fillRect(st.x, y, st.w + 1, H - y);
    ctx.fillStyle = kleurRand;
    ctx.fillRect(st.x, y, st.w + 1, 3);
    ctx.save();
    ctx.beginPath(); ctx.rect(st.x, y, st.w, H - y); ctx.clip();
    ctx.strokeStyle = kleurNaad; ctx.lineWidth = 2;
    for (let x = -t - 64; x < W + 64; x += 64) {
      ctx.beginPath(); ctx.moveTo(x, y + 3); ctx.lineTo(x, y + 32); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 32, y + 32); ctx.lineTo(x + 32, H); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(st.x, y + 32); ctx.lineTo(st.x + st.w, y + 32); ctx.stroke();
    ctx.restore();
  }
  // gouden randje bij elk opstapje
  for (let i = 1; i < stukken.length; i++) {
    const a = stukken[i - 1], b = stukken[i];
    if (a.h === b.h || b.x < -10 || b.x > W + 10) continue;
    ctx.fillStyle = kleurRand;
    ctx.fillRect(b.x - 2, G - Math.max(a.h, b.h), 3, Math.abs(a.h - b.h) + 3);
  }
}

function tekenRiool() {
  const lucht = ctx.createLinearGradient(0, 0, 0, G);
  lucht.addColorStop(0, '#0d1410');
  lucht.addColorStop(1, '#1f2b22');
  ctx.fillStyle = lucht;
  ctx.fillRect(0, 0, W, G);

  // bakstenen muur (beweegt langzaam)
  const p = scrollX * 0.3;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
  for (let rij = 0; rij * 22 < G; rij++) {
    const y = rij * 22, schuif = (rij % 2) * 24;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    for (let x = -((p + schuif) % 48); x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 22); ctx.stroke(); }
  }
  // tunnelbogen en lampjes
  const q = scrollX * 0.45, tussen = 300;
  for (let i = Math.floor(q / tussen) - 1; i * tussen - q < W + tussen; i++) {
    const x = i * tussen - q;
    ctx.strokeStyle = '#2c3a30'; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.arc(x + 150, G + 40, 190, Math.PI, 0); ctx.stroke();
    const lamp = ctx.createRadialGradient(x + 150, 60, 2, x + 150, 60, 90);
    lamp.addColorStop(0, 'rgba(190,255,150,0.30)');
    lamp.addColorStop(1, 'rgba(190,255,150,0)');
    ctx.fillStyle = lamp; ctx.fillRect(x + 60, 0, 180, 160);
    ctx.fillStyle = '#d8ffb0'; ctx.beginPath(); ctx.arc(x + 150, 60, 5, 0, Math.PI * 2); ctx.fill();
  }
  // buizen met druppels (dichterbij)
  const r = scrollX * 0.6, tussen2 = 420;
  for (let i = Math.floor(r / tussen2) - 1; i * tussen2 - r < W + tussen2; i++) {
    const x = i * tussen2 - r + hash(i) * 100, y = 150 + hash(i + 7) * 80;
    ctx.fillStyle = '#56645a'; ctx.fillRect(x, y, 160, 18);
    ctx.fillStyle = '#6d7d72'; ctx.fillRect(x, y, 160, 5);
    ctx.fillStyle = '#48554c'; ctx.fillRect(x - 6, y - 3, 10, 24); ctx.fillRect(x + 156, y - 3, 10, 24);
    const val = (tijd * 120 + hash(i) * 200) % (G - y);
    ctx.fillStyle = '#7fd13b';
    ctx.beginPath(); ctx.ellipse(x + 80, y + 18 + val, 3, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(127,209,59,0.5)';
    ctx.beginPath(); ctx.ellipse(x + 80, y + 22, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function tekenStralingsteken(x, y, r) {
  ctx.fillStyle = '#ffd400';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 3;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.85, a - Math.PI / 6, a + Math.PI / 6);
    ctx.arc(x, y, r * 0.3, a + Math.PI / 6, a - Math.PI / 6, true);
    ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(x, y, r * 0.18, 0, Math.PI * 2); ctx.fill();
}

function tekenRat(x, y, k, bukt, fase, grootte = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(grootte, grootte);
  const plat = bukt ? 0.55 : 1;
  const wieg = bukt ? 0 : Math.sin(fase * 2) * 1.2;

  // schaduw
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(6, 1, 30, 4, 0, 0, Math.PI * 2); ctx.fill();

  // staart
  ctx.strokeStyle = k.roze; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-22, -12 * plat);
  ctx.quadraticCurveTo(-42, -2 + Math.sin(fase) * 6, -58, -18 * plat + Math.sin(fase + 1) * 7);
  ctx.stroke();

  // pootjes
  ctx.fillStyle = k.roze;
  const s = Math.sin(fase) * 6;
  [[-12, s], [14, -s]].forEach(([px, d]) => {
    ctx.beginPath(); ctx.ellipse(px + d, -2, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
  });

  // lijf (de radioactieve rat gloeit)
  if (k.straling) { ctx.shadowColor = '#6dff4a'; ctx.shadowBlur = 14 + Math.sin(tijd * 6) * 6; }
  ctx.fillStyle = k.vacht;
  ctx.beginPath(); ctx.ellipse(0, -18 * plat + wieg, 26, 16 * plat, 0, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = k.buik;
  ctx.beginPath(); ctx.ellipse(5, -11 * plat + wieg, 16, 7 * plat, 0, 0, Math.PI * 2); ctx.fill();
  if (k.straling) tekenStralingsteken(-4, -20 * plat + wieg, bukt ? 6 : 9);

  // kop
  const ky = (bukt ? -10 : -24) + wieg;
  ctx.fillStyle = k.vacht;
  ctx.beginPath(); ctx.ellipse(24, ky, 14, bukt ? 9 : 11, 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(36, ky + 3, 10, 6, 0.2, 0, Math.PI * 2); ctx.fill();

  // hoofdband (Ninja)
  if (k.band) {
    ctx.fillStyle = k.band;
    ctx.fillRect(14, ky - 6, 22, 4);
    ctx.beginPath(); ctx.moveTo(14, ky - 5); ctx.lineTo(2, ky - 10 + Math.sin(fase * 2) * 3); ctx.lineTo(4, ky - 3); ctx.closePath(); ctx.fill();
  }

  // oor (plat als hij bukt)
  const oy = bukt ? ky - 5 : ky - 10, or = bukt ? 6 : 8;
  ctx.fillStyle = k.vacht;
  ctx.beginPath(); ctx.arc(17, oy, or, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = k.roze;
  ctx.beginPath(); ctx.arc(17, oy, or - 3, 0, Math.PI * 2); ctx.fill();

  // een drolletje op zijn hoofd (Poeprat)
  if (k.poep && !bukt) {
    const px = 22, py = ky - 10;
    [[0, 0, 10, 4], [0, -5, 7, 3.5], [1, -9, 4.5, 3]].forEach(([dx, dy, rx, ry]) => {
      ctx.fillStyle = '#5a3414';
      ctx.beginPath(); ctx.ellipse(px + dx, py + dy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a5a2b';
      ctx.beginPath(); ctx.ellipse(px + dx - rx * 0.3, py + dy - ry * 0.35, rx * 0.4, ry * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = '#5a3414';
    ctx.beginPath(); ctx.moveTo(px - 1, py - 11); ctx.quadraticCurveTo(px + 3, py - 17, px + 5, py - 14); ctx.lineTo(px + 3, py - 10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(160,220,90,0.8)'; ctx.lineWidth = 1.2;   // stinklijntjes
    for (let i = -1; i <= 1; i += 2) {
      const sx = px + i * 9, sy = py - 16 + Math.sin(tijd * 5 + i) * 2;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + 3, sy - 4, sx, sy - 8); ctx.stroke();
    }
  }

  // kroontje (Goudje)
  if (k.kroon && !bukt) {
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.moveTo(22, ky - 9); ctx.lineTo(22, ky - 19); ctx.lineTo(26, ky - 14); ctx.lineTo(30, ky - 21);
    ctx.lineTo(34, ky - 14); ctx.lineTo(38, ky - 19); ctx.lineTo(37, ky - 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e0315a';
    ctx.beginPath(); ctx.arc(30, ky - 12, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  // oog
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(29, ky - 3, 2.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(30, ky - 4, 1, 0, Math.PI * 2); ctx.fill();

  // neus en snorharen
  ctx.fillStyle = '#e7718a';
  ctx.beginPath(); ctx.arc(45, ky + 2, 3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(39, ky + 4); ctx.lineTo(54, ky);
  ctx.moveTo(39, ky + 5); ctx.lineTo(54, ky + 8);
  ctx.stroke();
  ctx.restore();
}

function tekenSpeler() {
  const k = RATJES[gekozen];
  if (toestand === 'overgang' && overgangT > 0.35 && overgangT < 1) return;   // in de put verdwenen
  if (k.straling && Math.random() < 0.3) deeltjes.push({ x: rat.x + willekeurig(-20, 30), y: rat.y - willekeurig(5, 30), vx: 0, vy: -40, leven: 0.5, straling: true });
  if (rat.boost > 0) {
    // regenboog-gloed rond het ratje
    const kleur = 'hsla(' + Math.floor(tijd * 360) % 360 + ',100%,60%,';
    const gloed = ctx.createRadialGradient(rat.x + 10, rat.y - 20, 5, rat.x + 10, rat.y - 20, 60);
    gloed.addColorStop(0, kleur + '0.7)');
    gloed.addColorStop(1, kleur + '0)');
    ctx.fillStyle = gloed;
    ctx.fillRect(rat.x - 50, rat.y - 80, 120, 120);
  }
  // knipperen na de superkracht
  if (rat.onkwetsbaar > 0 && Math.floor(tijd * 12) % 2) return;
  tekenRat(rat.x, rat.y, k, ratBukt(), rat.fase);
}

function tekenRioolObstakel(o) {
  const v = o.v;
  if (o.soort === 'val') {
    // een drol, precies zo groot als het stuk waar je tegenaan botst
    const cx = o.x + o.w / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, v + 1, 24, 4, 0, 0, Math.PI * 2); ctx.fill();
    [[0, -5, 22, 6], [0, -12, 16, 6], [1, -18, 10, 5]].forEach(([dx, dy, rx, ry], i) => {
      ctx.fillStyle = '#6b3e1a';
      ctx.beginPath(); ctx.ellipse(cx + dx, v + dy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8f5a2b';
      ctx.beginPath(); ctx.ellipse(cx + dx - rx * 0.3, v + dy - ry * 0.4, rx * 0.45, ry * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = '#6b3e1a';
    ctx.beginPath(); ctx.moveTo(cx - 5, v - 21); ctx.quadraticCurveTo(cx + 2, v - 30, cx + 6, v - 27); ctx.quadraticCurveTo(cx + 4, v - 22, cx + 6, v - 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 6, v - 12, 3.2, 0, Math.PI * 2); ctx.arc(cx + 6, v - 12, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(cx - 5, v - 12, 1.6, 0, Math.PI * 2); ctx.arc(cx + 7, v - 12, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(160,220,90,0.7)'; ctx.lineWidth = 2;   // stinklijntjes
    for (let i = -1; i <= 1; i++) {
      const sx = o.x + o.w / 2 + i * 10, sy = v - 32 + Math.sin(tijd * 5 + i) * 3;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + 5, sy - 6, sx, sy - 12); ctx.stroke();
    }
  } else if (o.soort === 'kist') {
    // twee rollen wc-papier op elkaar
    for (let i = 0; i < 2; i++) {
      const y = v - 20 - i * 20;
      ctx.fillStyle = '#f4f4f0'; ctx.fillRect(o.x + 4, y, o.w - 8, 20);
      ctx.fillStyle = '#d9d9d2'; ctx.fillRect(o.x + 4, y + 16, o.w - 8, 4);
      ctx.fillStyle = '#e8e8e2';
      ctx.beginPath(); ctx.ellipse(o.x + o.w - 4, y + 10, 5, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b89a6a';
      ctx.beginPath(); ctx.ellipse(o.x + o.w - 4, y + 10, 2, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#f4f4f0';   // los velletje
    ctx.fillRect(o.x + 6, v - 4, 14, 4);
  } else if (o.soort === 'stam') {
    // het uiteinde van een dikke rioolbuis
    const cx = o.x + o.r, cy = v - o.r;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, v + 2, o.r, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b766f';
    ctx.beginPath(); ctx.arc(cx, cy, o.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4d5751';
    ctx.beginPath(); ctx.arc(cx, cy, o.r - 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0c120e';
    ctx.beginPath(); ctx.arc(cx, cy, o.r - 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7fd13b';   // groen slijm
    ctx.beginPath(); ctx.ellipse(cx, cy + o.r - 16, 22, 6, 0, 0, Math.PI); ctx.fill();
    ctx.fillRect(cx + 10, cy + o.r - 14, 5, 10 + Math.sin(tijd * 3) * 3);
    if (o.nummer <= 3) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('2x springen! ⬆⬆', cx, cy - o.r - 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  } else {
    // een buis die uit het plafond komt, met een druppel
    const cx = o.x + o.w / 2, onder = v - 30;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, v + 2, o.w / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5f6b63'; ctx.fillRect(cx - 18, 0, 36, onder);
    ctx.fillStyle = '#76837a'; ctx.fillRect(cx - 18, 0, 8, onder);
    ctx.fillStyle = '#4b5650'; ctx.fillRect(cx - 24, onder - 14, 48, 14);
    ctx.fillRect(cx - 24, 60, 48, 10);
    const drup = (tijd * 90) % 40;
    ctx.fillStyle = '#7fd13b';
    ctx.beginPath(); ctx.ellipse(cx, onder + 4 + drup * 0.3, 4, 6, 0, 0, Math.PI * 2); ctx.fill();
    if (o.nummer <= 3) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('⬇ bukken!', cx, v + 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  }
}

function tekenObstakel(o) {
  if (level === 2) return tekenRioolObstakel(o);
  if (o.soort === 'val') {
    const x = o.x, y = o.v;
    ctx.fillStyle = '#a0612b';
    ctx.fillRect(x, y - 10, o.w, 10);
    ctx.fillStyle = '#7a4518';
    ctx.fillRect(x, y - 3, o.w, 3);
    ctx.strokeStyle = '#d7dbde'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 8, y - 10); ctx.lineTo(x + 8, y - 22); ctx.lineTo(x + o.w - 8, y - 22); ctx.lineTo(x + o.w - 8, y - 10);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x + o.w / 2, y - 12, 4, 0, Math.PI * 2); ctx.stroke();
    // lokaas
    ctx.fillStyle = '#f5c518';
    ctx.beginPath(); ctx.moveTo(x + o.w / 2 + 6, y - 10); ctx.lineTo(x + o.w / 2 + 16, y - 10); ctx.lineTo(x + o.w / 2 + 16, y - 17); ctx.closePath(); ctx.fill();
  } else if (o.soort === 'kist') {
    const x = o.x, y = o.v, w = o.w, h = o.h;
    ctx.fillStyle = '#6b3a16';
    ctx.fillRect(x, y - h * 0.65, w, h * 0.65);
    ctx.fillStyle = '#86491c';
    ctx.beginPath();
    ctx.moveTo(x, y - h * 0.65); ctx.lineTo(x, y - h * 0.8);
    ctx.quadraticCurveTo(x + w / 2, y - h * 1.1, x + w, y - h * 0.8);
    ctx.lineTo(x + w, y - h * 0.65); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e0b02a';
    ctx.fillRect(x + 6, y - h * 0.9, 5, h * 0.9);
    ctx.fillRect(x + w - 11, y - h * 0.9, 5, h * 0.9);
    ctx.fillRect(x, y - h * 0.67, w, 3);
    ctx.fillRect(x + w / 2 - 5, y - h * 0.7, 10, 11);
    ctx.fillStyle = '#3a1f08';
    ctx.fillRect(x + w / 2 - 1.5, y - h * 0.62, 3, 4);
  } else if (o.soort === 'stam') {
    // een dikke boomstam, van opzij gezien: je kijkt tegen de zaagkant aan
    const cx = o.x + o.r, cy = o.v - o.r;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, o.v + 2, o.r, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5b3a1e';
    ctx.beginPath(); ctx.arc(cx, cy, o.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d9a86a';
    ctx.beginPath(); ctx.arc(cx, cy, o.r - 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#b07f45'; ctx.lineWidth = 2;
    for (let k = 1; k <= 4; k++) { ctx.beginPath(); ctx.arc(cx + k, cy - k, (o.r - 8) * k / 5, 0, Math.PI * 2); ctx.stroke(); }
    ctx.strokeStyle = '#3e2712'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx + 6, cy - 4); ctx.lineTo(cx + 26, cy - 22); ctx.stroke();
    // mosplekje
    ctx.fillStyle = '#5f8f3a';
    ctx.beginPath(); ctx.ellipse(cx - 20, cy - o.r + 4, 18, 6, -0.3, 0, Math.PI * 2); ctx.fill();
    if (o.nummer <= 3) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('2x springen! ⬆⬆', cx, cy - o.r - 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  } else {
    const cx = o.x + o.w / 2, onder = o.v - 30;
    // schaduw op de vloer als waarschuwing
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, o.v + 2, o.w / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    // ketting
    ctx.strokeStyle = '#8a6d1f'; ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, onder - 30); ctx.stroke();
    ctx.setLineDash([]);
    // armen
    ctx.strokeStyle = '#d4a017'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(o.x + 2, onder - 22); ctx.quadraticCurveTo(cx, onder + 4, o.x + o.w - 2, onder - 22); ctx.stroke();
    ctx.fillStyle = '#d4a017';
    ctx.fillRect(cx - 4, onder - 32, 8, 22);
    // kaarsjes
    [o.x + 2, cx, o.x + o.w - 2].forEach((kx, i) => {
      const ky = i === 1 ? onder - 34 : onder - 24;
      ctx.fillStyle = '#f4ead2';
      ctx.fillRect(kx - 3, ky - 12, 6, 12);
      ctx.fillStyle = '#ffb02e';
      ctx.beginPath(); ctx.ellipse(kx, ky - 16, 3, 5 + Math.sin(tijd * 12 + i) * 1, 0, 0, Math.PI * 2); ctx.fill();
    });
    // kristallen
    ctx.fillStyle = '#bfe9ff';
    [-20, -7, 7, 20].forEach(d => {
      const top = onder - 12 + Math.abs(d) * -0.4;
      ctx.beginPath(); ctx.moveTo(cx + d - 3, top); ctx.lineTo(cx + d + 3, top); ctx.lineTo(cx + d, onder - Math.abs(d) * 0.3); ctx.closePath(); ctx.fill();
    });
    // bij de eerste kroonluchters een hint: hier moet je bukken
    if (o.nummer <= 3) {
      const knipper = 0.6 + Math.sin(tijd * 10) * 0.4;
      ctx.globalAlpha = knipper;
      tekst('⬇ bukken!', cx, o.v + 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  }
}

function tekenPut() {
  if (!put) return;
  const cx = put.x + 35, v = put.v;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, v + 2, 38, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#8a8f93'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(cx, v + 2, 38, 9, 0, 0, Math.PI * 2); ctx.stroke();
  // het deksel staat ernaast
  ctx.fillStyle = '#6e7377';
  ctx.beginPath(); ctx.ellipse(put.x + 100, v - 26, 9, 28, 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4d5155'; ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(put.x + 95, v - 26 + i * 9); ctx.lineTo(put.x + 105, v - 24 + i * 9); ctx.stroke(); }
  // groene gloed uit de put
  const gloed = ctx.createRadialGradient(cx, v, 2, cx, v, 60);
  gloed.addColorStop(0, 'rgba(120,255,80,0.45)');
  gloed.addColorStop(1, 'rgba(120,255,80,0)');
  ctx.fillStyle = gloed; ctx.fillRect(cx - 60, v - 60, 120, 70);
  ctx.globalAlpha = 0.6 + Math.sin(tijd * 8) * 0.4;
  tekst('⬇ DE PUT ⬇', cx, v - 75, 22, '#7dff9a');
  ctx.globalAlpha = 1;
}

function tekenGat(g) {
  // het gat zelf: diep en donker
  const v = g.v;
  const riool = level === 2;
  const diepte = ctx.createLinearGradient(0, v, 0, H);
  diepte.addColorStop(0, riool ? '#0e1a10' : '#120802');
  diepte.addColorStop(1, '#000');
  ctx.fillStyle = diepte;
  ctx.fillRect(g.x, v, g.w, H - v);
  if (riool) {
    // groen rioolwater met golfjes en belletjes
    const wy = v + 26;
    ctx.fillStyle = '#4fa82a';
    ctx.beginPath(); ctx.moveTo(g.x, H);
    for (let x = g.x; x <= g.x + g.w; x += 8) ctx.lineTo(x, wy + Math.sin(x * 0.08 + tijd * 4) * 3);
    ctx.lineTo(g.x + g.w, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(200,255,150,0.6)';
    for (let i = 0; i < g.w / 40; i++) {
      const bx = g.x + 15 + i * 40 + Math.sin(i * 7) * 8, by = wy + 8 + ((tijd * 25 + i * 13) % 30);
      ctx.beginPath(); ctx.arc(bx, H - (by - wy), 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.fillStyle = riool ? '#2a302c' : '#5a3816';
  ctx.fillRect(g.x - 4, v, 4, H - v);
  ctx.fillRect(g.x + g.w, v, 4, H - v);
  ctx.fillStyle = riool ? '#7fd13b' : '#d4a017';
  ctx.fillRect(g.x - 6, v, 6, 3);
  ctx.fillRect(g.x + g.w, v, 6, 3);

  // met superkracht ren je over een regenboogbrug
  if (rat.boost > 0) {
    const kleuren = ['#ff4d4d', '#ffa64d', '#ffe14d', '#5ce65c', '#4db8ff', '#a64dff'];
    kleuren.forEach((k, i) => { ctx.fillStyle = k; ctx.fillRect(g.x, v + i * 3, g.w, 3); });
  }
  if (g.trampX === null) return;

  // de trampoline
  const tx = g.trampX, tw = g.trampW, indruk = g.indruk > 0 ? 6 * g.indruk / 0.3 : 0;
  const G = g.v, mat = G - 14 + indruk;   // de trampoline staat op de vloer bij het gat
  ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(tx + 6, G); ctx.lineTo(tx + 10, G - 12);
  ctx.moveTo(tx + tw - 6, G); ctx.lineTo(tx + tw - 10, G - 12);
  ctx.stroke();
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const vx = tx + 10 + i * (tw - 20) / 4;
    ctx.beginPath(); ctx.moveTo(vx, G - 12); ctx.lineTo(vx, mat); ctx.stroke();
  }
  ctx.fillStyle = '#1b1b1b';
  ctx.beginPath(); ctx.ellipse(tx + tw / 2, mat, tw / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e02424'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(tx + tw / 2, mat, tw / 2, 5, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#2f7de0'; ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.ellipse(tx + tw / 2, mat, tw / 2, 5, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // bij de eerste gaten een hint
  if (g.nummer <= 2) {
    ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
    tekst('Trampoline! ⬇', tx + tw / 2, G - 60, 18, '#7dff9a');
    ctx.globalAlpha = 1;
  }
}

function tekenClown() {
  const y = vloerY(rat.x) - (voet.til || 0);
  const bx = Math.min(voet.x, voetRust());          // waar zijn lijf staat
  const neus = voet.x + VOET_B;                      // de punt van zijn grote schoen
  const wiebel = Math.sin(tijd * 9) * 3;

  // de rode ballon aan een touwtje
  const ballonX = bx + 92 + Math.sin(tijd * 1.7) * 6, ballonY = y - 190 + Math.sin(tijd * 2.3) * 5;
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(bx + 78, y - 86); ctx.quadraticCurveTo(bx + 95, y - 130, ballonX, ballonY + 24); ctx.stroke();
  ctx.fillStyle = '#e8141e';
  ctx.beginPath(); ctx.ellipse(ballonX, ballonY, 19, 23, 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ballonX - 4, ballonY + 26); ctx.lineTo(ballonX + 4, ballonY + 26); ctx.lineTo(ballonX, ballonY + 21); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(ballonX - 7, ballonY - 8, 5, 8, 0.4, 0, Math.PI * 2); ctx.fill();

  // achterste schoen
  ctx.fillStyle = '#d61f1f';
  ctx.beginPath(); ctx.ellipse(bx + 30 - wiebel, y - 9, 26, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(bx + 6 - wiebel, y - 3, 48, 3);

  // voorste been: een rekbaar gestreept been naar de grote schoen
  const heup = { x: bx + 52, y: y - 34 }, hiel = { x: neus - 58, y: y - 12 };
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#2f7de0'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(heup.x, heup.y); ctx.lineTo(hiel.x, hiel.y); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.setLineDash([5, 7]);
  ctx.beginPath(); ctx.moveTo(heup.x, heup.y); ctx.lineTo(hiel.x, hiel.y); ctx.stroke();
  ctx.setLineDash([]);

  // de grote clownsschoen
  ctx.fillStyle = '#d61f1f';
  ctx.beginPath(); ctx.ellipse(neus - 32, y - 10, 32, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(neus - 13, y - 15, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(neus - 62, y - 3, 60, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(neus - 16, y - 19, 4, 0, Math.PI * 2); ctx.fill();

  // broek met stippen
  ctx.fillStyle = '#2f7de0';
  ctx.fillRect(bx + 14, y - 78, 56, 50);
  ctx.fillStyle = '#ffd23f';
  [[24, -68], [48, -60], [36, -44], [60, -40], [22, -38]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(bx + dx, y + dy, 4, 0, Math.PI * 2); ctx.fill(); });
  // gele bloes
  ctx.fillStyle = '#ffcf26';
  ctx.beginPath(); ctx.ellipse(bx + 42, y - 92, 28, 22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8141e';
  [-100, -90, -80].forEach(dy => { ctx.beginPath(); ctx.arc(bx + 44, y + dy, 3, 0, Math.PI * 2); ctx.fill(); });
  // arm met handschoen die de ballon vasthoudt
  ctx.strokeStyle = '#ffcf26'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(bx + 62, y - 100); ctx.lineTo(bx + 76, y - 88); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(bx + 78, y - 86, 6, 0, Math.PI * 2); ctx.fill();
  // kraag
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  for (let i = 0; i <= 8; i++) ctx.lineTo(bx + 20 + i * 5.5, y - 112 + (i % 2) * 7);
  ctx.lineTo(bx + 64, y - 106); ctx.lineTo(bx + 20, y - 106); ctx.closePath(); ctx.fill();

  // hoofd
  const hx = bx + 44, hy = y - 132;
  ctx.fillStyle = '#ff7a1a';   // oranje haar
  [[-18, -6], [-21, 6], [18, -6], [21, 6]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(hx + dx, hy + dy, 10, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(hx, hy, 19, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1f6fd6';   // klein hoedje
  ctx.beginPath(); ctx.moveTo(hx - 9, hy - 16); ctx.lineTo(hx + 9, hy - 16); ctx.lineTo(hx + 2, hy - 38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(hx + 2, hy - 39, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';      // ogen kijken naar het ratje
  ctx.beginPath(); ctx.arc(hx + 2, hy - 5, 2.6, 0, Math.PI * 2); ctx.arc(hx + 11, hy - 5, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2b62c4'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(hx + 2, hy - 12); ctx.lineTo(hx + 2, hy - 2); ctx.moveTo(hx + 11, hy - 12); ctx.lineTo(hx + 11, hy - 2); ctx.stroke();
  ctx.strokeStyle = '#e8141e'; ctx.lineWidth = 3;   // grote lach
  ctx.beginPath(); ctx.arc(hx + 4, hy + 2, 10, 0.2, Math.PI - 0.4); ctx.stroke();
  ctx.fillStyle = '#e8141e';   // rode neus
  ctx.beginPath(); ctx.arc(hx + 16, hy + 1, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(hx + 14, hy - 1, 1.8, 0, Math.PI * 2); ctx.fill();
}

function tekenVoet() {
  if (!voet.actief) return;
  if (voet.soort === 'clown') { tekenClown(); tekenTrapWaarschuwing(); return; }
  const vloerOnder = vloerY(rat.x), x = voet.x, til = voet.til || 0;
  const zool = vloerOnder - til;
  // been (spijkerbroek) van boven het scherm
  ctx.fillStyle = '#2f4f86';
  ctx.fillRect(x + 8, -10, 58, zool - 40);
  ctx.fillStyle = '#26406d';
  ctx.fillRect(x + 8, zool - 62, 58, 10);
  // sok
  ctx.fillStyle = '#f2f2f2';
  ctx.fillRect(x + 12, zool - 52, 50, 14);
  // schoen
  ctx.fillStyle = '#e02424';
  ctx.beginPath();
  ctx.moveTo(x + 6, zool - 8);
  ctx.lineTo(x + 6, zool - 42);
  ctx.lineTo(x + 66, zool - 42);
  ctx.quadraticCurveTo(x + 80, zool - 30, VOET_B + x - 18, zool - 28);
  ctx.quadraticCurveTo(x + VOET_B + 2, zool - 24, x + VOET_B, zool - 8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 4, zool - 9, VOET_B - 2, 9);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x + 62 + i * 9, zool - 38 + i * 3); ctx.lineTo(x + 70 + i * 9, zool - 30 + i * 3); ctx.stroke(); }
  tekenTrapWaarschuwing();
}
function tekenTrapWaarschuwing() {
  // aftellen tot je moet springen: 2... 1... SPRING!
  const x = rat.x + 10, y = rat.y - 82;
  if (voet.fase === 'aftellen') {
    const over = INSTELLINGEN.aftellen - voet.t;
    tekst('Spring over ' + Math.ceil(over), x, y, 24, '#ffd23f');
    // balkje dat leegloopt
    const bw = 90;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x - bw / 2, y + 18, bw, 8);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - bw / 2, y + 18, bw * over / INSTELLINGEN.aftellen, 8);
  } else if (voet.fase === 'aanloop') {
    const groot = 30 + Math.sin(tijd * 30) * 3;
    tekst('SPRING!', x, y, groot, '#ff4d4d');
  }
}

function tekenLekker(l) {
  const y = l.y + Math.sin(tijd * 4 + l.fase) * 3;
  if (l.goud || l.speciaal) {
    const kleur = l.speciaal ? 'hsla(' + Math.floor(tijd * 300) % 360 + ',100%,65%,' : 'rgba(255,230,90,';
    const r = l.speciaal ? 40 : 30;
    const gloed = ctx.createRadialGradient(l.x, y, 2, l.x, y, r);
    gloed.addColorStop(0, kleur + '0.9)');
    gloed.addColorStop(1, kleur + '0)');
    ctx.fillStyle = gloed;
    ctx.fillRect(l.x - r, y - r, r * 2, r * 2);
  }
  ctx.save();
  ctx.translate(l.x, y);
  if (l.speciaal) ctx.rotate(Math.sin(tijd * 6) * 0.3);
  ctx.font = (l.speciaal ? 38 : l.goud ? 34 : 28) + 'px ' + EMOJI;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(l.soort, 0, 0);
  ctx.restore();
}

function tekenDeeltjes() {
  deeltjes.forEach(d => {
    ctx.globalAlpha = Math.min(1, d.leven * 2);
    if (d.straling) {
      ctx.fillStyle = '#8dff5a';
      ctx.beginPath(); ctx.arc(d.x, d.y, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (d.ster) {
      ctx.fillStyle = '#ffe680';
      ctx.fillRect(d.x - 2, d.y - 2, 4, 4);
    } else if (d.regenboog) {
      ctx.fillStyle = 'hsl(' + Math.floor((d.x + d.y + tijd * 300) % 360) + ',100%,65%)';
      ctx.beginPath(); ctx.arc(d.x, d.y, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (d.wolkje) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(d.x, d.y, 5, 0, Math.PI * 2); ctx.fill();
    } else if (d.groot) {
      tekst(d.tekst, d.x, d.y, 34, '#ff6a3d');
    } else {
      tekst(d.tekst, d.x, d.y, 20, d.goud ? '#ffe14d' : '#fff');
    }
  });
  ctx.globalAlpha = 1;
}

function tekst(t, x, y, grootte, kleur = '#fff', uitlijnen = 'center', dik = true) {
  ctx.font = (dik ? '800 ' : '600 ') + grootte + 'px system-ui, -apple-system, sans-serif';
  ctx.textAlign = uitlijnen; ctx.textBaseline = 'middle';
  ctx.lineWidth = grootte / 6; ctx.strokeStyle = 'rgba(30,12,0,0.85)'; ctx.lineJoin = 'round';
  ctx.strokeText(t, x, y);
  ctx.fillStyle = kleur;
  ctx.fillText(t, x, y);
}

function tekenScore() {
  tekst('🧀 ' + score, 18, 30, 26, '#ffe14d', 'left');
  tekst(Math.floor(afstand / 40) + ' m', W / 2, 30, 20, '#fff');
  tekst(level === 2 ? 'Level 2: het riool' : 'Level 1: de schatkamer', W / 2, 52, 13, level === 2 ? '#9dff6a' : '#ffd27a', 'center', false);
  if (put) tekst('Nog ' + Math.max(0, Math.ceil((put.x - rat.x) / 40)) + ' m tot de put', W - 18, 54, 16, '#9dff6a', 'right');
  else if (level === 1) tekst('Put bij ' + INSTELLINGEN.levelPunten + ' 🧀', W - 18, 54, 15, '#9dff6a', 'right', false);
  tekst('Record ' + recordVan(level), W - 18, 30, 18, '#ffd27a', 'right', false);
  if (voet.actief && voet.tijd > 0) tekst((voet.soort === 'clown' ? '🤡 ' : '🦶 ') + Math.ceil(voet.tijd), 18, 62, 20, '#ff9a7a', 'left');
  if (rat.boost > 0) {
    // balk die laat zien hoe lang de superkracht nog duurt
    const bw = 200, bx = W / 2 - bw / 2, by = 66;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, bw, 12);
    ctx.fillStyle = 'hsl(' + Math.floor(tijd * 360) % 360 + ',100%,60%)';
    ctx.fillRect(bx, by, bw * rat.boost / INSTELLINGEN.boostDuur, 12);
    tekst('🍭 SUPERKRACHT  x2', W / 2, by + 28, 16, '#fff');
  }
}

function tekenMenu() {
  ctx.fillStyle = 'rgba(20,8,0,0.5)';
  ctx.fillRect(0, 0, W, H);
  tekst('KAAS ROYALE', W / 2, 52, 48, '#ffd23f');
  tekst(slide === 2 ? 'Spring over de poep en ontwijk de clown!' : 'Pak al het lekkers en ontsnap via de put naar het riool!', W / 2, 92, 16, '#fff', 'center', false);

  // naam van het level, met pijltjes en bolletjes als er een tweede slide is
  const kleur = slide === 2 ? '#9dff6a' : '#ffd23f';
  tekst(slide === 2 ? 'LEVEL 2: HET RIOOL' : 'LEVEL 1: DE SCHATKAMER', W / 2, PIJL_Y, 24, kleur);
  if (level2Open) {
    const knipper = 0.55 + Math.sin(tijd * 5) * 0.45;
    if (slide === 1) { ctx.globalAlpha = knipper; tekst('LEVEL 2  ›', W / 2 + 215, PIJL_Y, 20, '#9dff6a'); ctx.globalAlpha = 1; }
    else tekst('‹  LEVEL 1', W / 2 - 215, PIJL_Y, 20, '#ffd23f');
    [1, 2].forEach(n => {
      ctx.fillStyle = n === slide ? kleur : 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(W / 2 + (n === 1 ? -9 : 9), PIJL_Y + 22, 4.5, 0, Math.PI * 2); ctx.fill();
    });
  } else {
    tekst('🔒 Level 2: haal ' + INSTELLINGEN.levelPunten + ' punten in level 1', W / 2, PIJL_Y + 24, 14, '#9dff6a', 'center', false);
  }
  tekst(meldingTijd > 0 ? melding : 'Kies je ratje' + (slide === 2 ? '  ·  record ' + record2 : ''), W / 2, 194, 19, meldingTijd > 0 ? '#ff9a7a' : '#ffe9b0', 'center', meldingTijd <= 0);

  const lijst = slideRatjes();
  const vak = W / lijst.length;
  const grootte = Math.min(1.5, vak / 125);
  lijst.forEach((k, i) => {
    const x = vak * (i + 0.5) - 8 * grootte;
    if (RATJES.indexOf(k) === gekozen) {
      ctx.fillStyle = 'rgba(255,210,63,0.25)';
      ctx.beginPath(); ctx.ellipse(x + 10 * grootte, G - 2, 55 * grootte, 12, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (ratOpen(k)) {
      tekenRat(x, G - 8, k, false, tijd * 4 + i * 2, grootte);
      tekst(k.naam, x + 10 * grootte, G + 28, 19, '#fff');
    } else {
      // nog op slot: alleen een schaduw
      ctx.globalAlpha = 0.6;
      tekenRat(x, G - 8, { vacht: '#140a03', buik: '#140a03', roze: '#140a03' }, false, 0, grootte);
      ctx.globalAlpha = 1;
      tekst('🔒', x + 5 * grootte, G - 35 * grootte, 24);
      tekst(k.nodig + ' punten' + (ratLevel(k) === 2 ? ' (level 2)' : ''), x + 10 * grootte, G + 28, 15, '#ffd27a', 'center', false);
    }
  });
  tekst(level2Open ? 'Veeg opzij voor het andere level  ·  tik op je ratje om te starten' : 'Tik = springen  ·  2x tikken = hoger  ·  veeg omlaag = bukken', W / 2, H - 12, 14, '#e8cfa0', 'center', false);
  tekst('versie ' + VERSIE, W - 8, H - 12, 11, '#8a7a60', 'right', false);
}

function tekenAf() {
  ctx.fillStyle = 'rgba(20,8,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  tekst(oorzaak, W / 2, 80, 34, '#ff8a5c');
  tekst('Je pakte ' + score + ' punten', W / 2, 132, 28, '#ffe14d');
  if (nieuwRecord) tekst('Nieuw record! 🏆', W / 2, 172, 24, '#7dff9a');
  else tekst('Record in level ' + level + ': ' + recordVan(level), W / 2, 172, 20, '#ffd27a', 'center', false);
  if (vrijgespeeld.length) {
    tekst('Nieuw ratje vrijgespeeld: ' + vrijgespeeld.map(k => k.naam).join(' en ') + '! 🐀', W / 2, 214, 22, '#7dd8ff');
  } else {
    const volgende = RATJES.find(k => ratLevel(k) === level && k.nodig > recordVan(level));
    if (volgende) tekst('Nog ' + (volgende.nodig - recordVan(level)) + ' punten in level ' + level + ' tot ' + volgende.naam, W / 2, 214, 18, '#e8cfa0', 'center', false);
  }
  if (afSinds > 0.7) tekst('Tik om verder te gaan', W / 2, 264, 22, '#fff', 'center', false);
}

function tekenDraaiTelefoon() {
  ctx.fillStyle = 'rgba(20,8,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  tekst('📱 ↻', W / 2, H / 2 - 40, 44, '#fff');
  tekst('Draai je telefoon', W / 2, H / 2 + 20, 22, '#ffd23f');
  tekst('dwars', W / 2, H / 2 + 50, 22, '#ffd23f');
}

function tekenen() {
  ctx.save();
  if (schudden > 0) ctx.translate(willekeurig(-6, 6) * schudden * 3, willekeurig(-6, 6) * schudden * 3);
  tekenAchtergrond();

  if (toestand !== 'menu') {
    gaten.forEach(tekenGat);
    tekenPut();
    lekkers.forEach(tekenLekker);
    dingen.forEach(tekenObstakel);
    tekenVoet();
    tekenSpeler();
    tekenDeeltjes();
    tekenScore();
  }
  ctx.restore();

  if (toestand === 'menu') tekenMenu();
  if (toestand === 'af') tekenAf();
  if (toestand === 'overgang') {
    // het scherm wordt zwart en weer licht, met in het midden het nieuwe level
    const t = overgangT;
    ctx.globalAlpha = t < 1 ? t : Math.max(0, 1 - (t - 1.4) / 1);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    if (t > 0.6 && t < 2.3) {
      tekst('LEVEL 2', W / 2, H / 2 - 30, 54, '#7dff9a');
      tekst('Het riool 🐀', W / 2, H / 2 + 25, 26, '#fff');
      tekst('Je punten beginnen opnieuw', W / 2, H / 2 + 62, 18, '#e8cfa0', 'center', false);
      if (vrijgespeeld.length) tekst('Nieuw ratje: ' + vrijgespeeld.map(k => k.naam).join(' en ') + '! 🐀', W / 2, H / 2 + 96, 20, '#7dd8ff');
    }
  }
  if (W < 480) tekenDraaiTelefoon();
}

// ----- De spellus -----
