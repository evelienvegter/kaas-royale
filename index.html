      ctx.beginPath(); ctx.arc(x + 62 + k * 15 + Math.sin(t * 6 + k) * 8, y - 48 - t * 90, 10 + t * 14, 0, Math.PI * 2); ctx.fill();
    }
    // een schaal met kippenbouten en hamburgers
    const sx = x + 300;
    ctx.fillStyle = '#f4f1ea';
    ctx.beginPath(); ctx.ellipse(sx, G - 6, 52, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2f7de0';
    ctx.beginPath(); ctx.ellipse(sx, G - 6, 52, 9, 0, 0, Math.PI * 2); ctx.lineWidth = 3; ctx.strokeStyle = '#2f7de0'; ctx.stroke();
    ctx.font = '30px ' + EMOJI; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('🍗', sx - 26, G - 6); ctx.fillText('🍔', sx + 4, G - 8); ctx.fillText('🍗', sx + 30, G - 6);
  }
}

function tekenKapsalon() {
  // een vrolijke kapsalon: roze en paars, spiegels met lampjes en een kappaal
  const lucht = ctx.createLinearGradient(0, 0, 0, G);
  lucht.addColorStop(0, '#3b1d45');
  lucht.addColorStop(1, '#6a2f63');
  ctx.fillStyle = lucht;
  ctx.fillRect(0, 0, W, G);
  // behang met streepjes
  const p = scrollX * 0.3;
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let x = -(p % 40); x < W; x += 40) ctx.fillRect(x, 0, 16, G);

  const q = scrollX * 0.42, tussen = 480;
  for (let i = Math.floor(q / tussen) - 1; i * tussen - q < W + tussen; i++) {
    const x = i * tussen - q;
    // spiegel met lampjes
    ctx.fillStyle = '#d9d4df'; ctx.fillRect(x + 40, 40, 150, 150);
    const glas = ctx.createLinearGradient(x + 50, 50, x + 180, 180);
    glas.addColorStop(0, '#a9d8f0'); glas.addColorStop(1, '#5c8fb0');
    ctx.fillStyle = glas; ctx.fillRect(x + 50, 50, 130, 130);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.moveTo(x + 70, 50); ctx.lineTo(x + 100, 50); ctx.lineTo(x + 60, 180); ctx.lineTo(x + 50, 180); ctx.closePath(); ctx.fill();
    for (let k = 0; k < 6; k++) {
      const aan = 0.6 + 0.4 * Math.sin(tijd * 3 + k + i);
      ctx.fillStyle = 'rgba(255,236,150,' + aan + ')';
      ctx.beginPath(); ctx.arc(x + 52 + k * 25, 38, 6, 0, Math.PI * 2); ctx.fill();
    }
    // plankje met flessen shampoo
    ctx.fillStyle = '#f4f0f6'; ctx.fillRect(x + 30, 196, 170, 8);
    ['#ff5fa8', '#5fd0ff', '#ffd34d', '#8be36b', '#c38bff'].forEach((kleur, k) => {
      const hoog = 22 + (k % 2) * 8;
      ctx.fillStyle = kleur; ctx.fillRect(x + 40 + k * 32, 196 - hoog, 18, hoog);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 44 + k * 32, 190 - hoog, 10, 6);
    });
    // kappaal met draaiende rood-wit-blauwe strepen
    const px = x + 300;
    ctx.fillStyle = '#d9d4df'; ctx.fillRect(px - 4, 60, 34, 10); ctx.fillRect(px - 4, 190, 34, 10);
    ctx.save(); ctx.beginPath(); ctx.rect(px, 70, 26, 120); ctx.clip();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(px, 70, 26, 120);
    const schuif = (tijd * 30) % 36;
    for (let k = -2; k < 8; k++) {
      ctx.fillStyle = k % 2 ? '#e0242a' : '#2f5fe0';
      const yy = 60 + k * 18 + schuif;
      ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px + 26, yy - 14); ctx.lineTo(px + 26, yy - 5); ctx.lineTo(px, yy + 9); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // een poster met een coole coupe
    ctx.fillStyle = '#fff2f8'; ctx.fillRect(x + 360, 70, 80, 100);
    ctx.fillStyle = '#f2c9a0'; ctx.beginPath(); ctx.arc(x + 400, 125, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2f6fe0'; ctx.beginPath(); ctx.ellipse(x + 400, 104, 24, 12, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#e0247a'; ctx.font = 'bold 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('FRESH CUT', x + 400, 160);
  }
  // kappersstoelen (dichterbij)
  const r = scrollX * 0.6, tussen2 = 560;
  for (let i = Math.floor(r / tussen2) - 1; i * tussen2 - r < W + tussen2; i++) {
    const x = i * tussen2 - r + hash(i) * 100;
    ctx.fillStyle = '#9aa0a8'; ctx.fillRect(x + 36, G - 34, 8, 30); ctx.fillRect(x + 14, G - 6, 52, 6);
    ctx.fillStyle = '#c8243c';
    ctx.fillRect(x + 6, G - 56, 68, 22);
    ctx.fillRect(x + 58, G - 110, 18, 60);
    ctx.fillStyle = '#e04a5e'; ctx.fillRect(x + 10, G - 54, 60, 6);
    ctx.fillStyle = '#9aa0a8'; ctx.fillRect(x + 2, G - 66, 30, 6);
  }
}


function tekenStralingsteken(x, y, r) {
  ctx.fillStyle = '#ffd400';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 3;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.85, a - Math.PI / 6, a + Math.PI / 6);
    ctx.arc(x, y, r * 0.3, a + Math.PI / 6, a - Math.PI / 6, true);
    ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(x, y, r * 0.18, 0, Math.PI * 2); ctx.fill();
}

function tekenRat(x, y, k, bukt, fase, grootte = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(grootte, grootte);
  const plat = bukt ? 0.55 : 1;
  const wieg = bukt ? 0 : Math.sin(fase * 2) * 1.2;

  // schaduw
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(6, 1, 30, 4, 0, 0, Math.PI * 2); ctx.fill();

  // staart
  ctx.strokeStyle = k.roze; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-22, -12 * plat);
  ctx.quadraticCurveTo(-42, -2 + Math.sin(fase) * 6, -58, -18 * plat + Math.sin(fase + 1) * 7);
  ctx.stroke();

  // pootjes
  ctx.fillStyle = k.roze;
  const s = Math.sin(fase) * 6;
  [[-12, s], [14, -s]].forEach(([px, d]) => {
    ctx.beginPath(); ctx.ellipse(px + d, -2, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
  });

  // lijf (de radioactieve rat gloeit)
  if (k.straling) { ctx.shadowColor = '#6dff4a'; ctx.shadowBlur = 14 + Math.sin(tijd * 6) * 6; }
  ctx.fillStyle = k.vacht;
  ctx.beginPath(); ctx.ellipse(0, -18 * plat + wieg, 26, 16 * plat, 0, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = k.buik;
  ctx.beginPath(); ctx.ellipse(5, -11 * plat + wieg, 16, 7 * plat, 0, 0, Math.PI * 2); ctx.fill();
  if (k.straling) tekenStralingsteken(-4, -20 * plat + wieg, bukt ? 6 : 9);
  if (k.hotdog) {
    // in een broodje, met een streep mosterd
    ctx.fillStyle = '#e8b66a';
    ctx.beginPath(); ctx.ellipse(-2, -6 * plat + wieg, 30, 8 * plat, 0, 0, Math.PI); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-2, -8 * plat + wieg, 30, 6 * plat, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) ctx.lineTo(-22 + i * 5.5, -30 * plat + wieg + (i % 2 ? -3 : 3));
    ctx.stroke();
  }
  if (k.verbrand) {
    // gloeiende vonkjes en rookwolkjes boven zijn kop
    ctx.fillStyle = '#ff6a1f';
    [[-10, -22], [6, -14], [-2, -30]].forEach(([dx, dy], i) => { ctx.globalAlpha = 0.5 + Math.sin(tijd * 8 + i) * 0.4; ctx.beginPath(); ctx.arc(dx, dy * plat + wieg, 2, 0, Math.PI * 2); ctx.fill(); });
    ctx.globalAlpha = 1;
    for (let i = 0; i < 3; i++) {
      const t = (tijd * 0.7 + i / 3) % 1;
      ctx.fillStyle = 'rgba(120,120,120,' + (0.55 * (1 - t)) + ')';
      ctx.beginPath(); ctx.arc(18 + Math.sin(t * 5 + i) * 6, -40 * plat - t * 40, 6 + t * 9, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (k.langHaar) {
    // heel lang golvend haar dat achter hem aan wappert
    ctx.fillStyle = '#f0cf5a';
    ctx.beginPath();
    ctx.moveTo(26, -34 * plat + wieg);
    for (let i = 0; i <= 8; i++) ctx.lineTo(20 - i * 10, -34 * plat + wieg + i * 2.2 + Math.sin(tijd * 8 + i) * 3);
    for (let i = 8; i >= 0; i--) ctx.lineTo(20 - i * 10, -20 * plat + wieg + i * 2.8 + Math.sin(tijd * 8 + i) * 3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#d4ad34'; ctx.lineWidth = 1.2;
    for (let j = 0; j < 3; j++) { ctx.beginPath(); for (let i = 0; i <= 8; i++) ctx.lineTo(20 - i * 10, -30 * plat + wieg + j * 4 + i * 2.5 + Math.sin(tijd * 8 + i) * 3); ctx.stroke(); }
  }
  if (k.wcpapier) {
    // ingepakt in wc-papier, met een lange sliert die achter hem aan wappert
    ctx.strokeStyle = 'rgba(150,150,150,0.55)'; ctx.lineWidth = 1.5;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(i * 10 - 6, -32 * plat + wieg); ctx.lineTo(i * 10 + 6, -4 * plat + wieg); ctx.stroke();
    }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-20, -24 * plat + wieg);
    for (let i = 0; i <= 6; i++) ctx.lineTo(-20 - i * 9, -24 * plat - 6 + Math.sin(tijd * 9 + i * 0.9) * 5 - i * 1.5);
    for (let i = 6; i >= 0; i--) ctx.lineTo(-20 - i * 9, -24 * plat + 4 + Math.sin(tijd * 9 + i * 0.9) * 5 - i * 1.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#cfcfcf'; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
    for (let i = 1; i <= 6; i += 2) { const sx = -20 - i * 9; ctx.beginPath(); ctx.moveTo(sx, -24 * plat - 7 + Math.sin(tijd * 9 + i * 0.9) * 5 - i * 1.5); ctx.lineTo(sx, -24 * plat + 5 + Math.sin(tijd * 9 + i * 0.9) * 5 - i * 1.5); ctx.stroke(); }
    ctx.setLineDash([]);
  }
  if (k.slijm) {
    // glimmend groen slijm dat van hem af druipt
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(-8, -26 * plat + wieg, 10, 4 * plat, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8fe04a';
    [[-14, 0.0], [2, 0.4], [14, 0.75]].forEach(([dx, fase]) => {
      const t = (tijd * 1.2 + fase) % 1;
      ctx.beginPath(); ctx.ellipse(dx, -6 * plat + t * 10, 2.5, 3.5 + t * 2, 0, 0, Math.PI * 2); ctx.fill();
    });
  }

  // kop
  const ky = (bukt ? -10 : -24) + wieg;
  ctx.fillStyle = k.vacht;
  ctx.beginPath(); ctx.ellipse(24, ky, 14, bukt ? 9 : 11, 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(36, ky + 3, 10, 6, 0.2, 0, Math.PI * 2); ctx.fill();

  // hoofdband (Ninja)
  if (k.band) {
    ctx.fillStyle = k.band;
    ctx.fillRect(14, ky - 6, 22, 4);
    ctx.beginPath(); ctx.moveTo(14, ky - 5); ctx.lineTo(2, ky - 10 + Math.sin(fase * 2) * 3); ctx.lineTo(4, ky - 3); ctx.closePath(); ctx.fill();
  }

  // oor (plat als hij bukt)
  const oy = bukt ? ky - 5 : ky - 10, or = bukt ? 6 : 8;
  ctx.fillStyle = k.vacht;
  ctx.beginPath(); ctx.arc(17, oy, or, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = k.roze;
  ctx.beginPath(); ctx.arc(17, oy, or - 3, 0, Math.PI * 2); ctx.fill();

  // een drolletje op zijn hoofd (Poeprat)
  if (k.poep && !bukt) {
    const px = 22, py = ky - 10;
    [[0, 0, 10, 4], [0, -5, 7, 3.5], [1, -9, 4.5, 3]].forEach(([dx, dy, rx, ry]) => {
      ctx.fillStyle = '#5a3414';
      ctx.beginPath(); ctx.ellipse(px + dx, py + dy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a5a2b';
      ctx.beginPath(); ctx.ellipse(px + dx - rx * 0.3, py + dy - ry * 0.35, rx * 0.4, ry * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = '#5a3414';
    ctx.beginPath(); ctx.moveTo(px - 1, py - 11); ctx.quadraticCurveTo(px + 3, py - 17, px + 5, py - 14); ctx.lineTo(px + 3, py - 10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(160,220,90,0.8)'; ctx.lineWidth = 1.2;   // stinklijntjes
    for (let i = -1; i <= 1; i += 2) {
      const sx = px + i * 9, sy = py - 16 + Math.sin(tijd * 5 + i) * 2;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + 3, sy - 4, sx, sy - 8); ctx.stroke();
    }
  }

  // krullen (Krul)
  if (k.krullen && !bukt) {
    ctx.fillStyle = '#c0703a';
    [[14, -9], [21, -13], [28, -11], [34, -6], [17, -3], [24, -6], [9, -3]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(dx, ky + dy, 5, 0, Math.PI * 2); ctx.fill(); });
    ctx.strokeStyle = '#8a4a20'; ctx.lineWidth = 1.2;
    [[14, -9], [21, -13], [28, -11], [34, -6]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(dx, ky + dy, 2.5, 0, Math.PI * 1.5); ctx.stroke(); });
  }
  // blauwe low taper fade
  if (k.fade && !bukt) {
    ctx.fillStyle = '#2f6fe0';
    ctx.beginPath(); ctx.moveTo(12, ky - 6); ctx.quadraticCurveTo(14, ky - 20, 30, ky - 17); ctx.quadraticCurveTo(40, ky - 15, 36, ky - 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5fa0ff';
    ctx.beginPath(); ctx.moveTo(16, ky - 12); ctx.quadraticCurveTo(24, ky - 19, 32, ky - 15); ctx.lineTo(30, ky - 13); ctx.closePath(); ctx.fill();
    // de fade: van blauw naar de vacht, laag bij het oor
    ['rgba(47,111,224,0.55)', 'rgba(47,111,224,0.3)', 'rgba(47,111,224,0.12)'].forEach((kleur, i) => {
      ctx.fillStyle = kleur; ctx.fillRect(12, ky - 6 + i * 3, 22, 3);
    });
  }

  // koksmuts (Chef)
  if (k.koksmuts && !bukt) {
    ctx.fillStyle = '#f7f7f7';
    ctx.fillRect(16, ky - 17, 18, 8);
    [[18, -22, 7], [25, -26, 8], [32, -22, 7]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(dx, ky + dy, r, 0, Math.PI * 2); ctx.fill(); });
    ctx.strokeStyle = '#d4d4d4'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(16, ky - 12); ctx.lineTo(34, ky - 12); ctx.stroke();
  }

  // kroontje (Goudje)
  if (k.kroon && !bukt) {
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.moveTo(22, ky - 9); ctx.lineTo(22, ky - 19); ctx.lineTo(26, ky - 14); ctx.lineTo(30, ky - 21);
    ctx.lineTo(34, ky - 14); ctx.lineTo(38, ky - 19); ctx.lineTo(37, ky - 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e0315a';
    ctx.beginPath(); ctx.arc(30, ky - 12, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  // oog
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(29, ky - 3, 2.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(30, ky - 4, 1, 0, Math.PI * 2); ctx.fill();

  // neus en snorharen
  ctx.fillStyle = '#e7718a';
  ctx.beginPath(); ctx.arc(45, ky + 2, 3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(39, ky + 4); ctx.lineTo(54, ky);
  ctx.moveTo(39, ky + 5); ctx.lineTo(54, ky + 8);
  ctx.stroke();
  ctx.restore();
}

function tekenSpeler() {
  const k = RATJES[gekozen];
  if (toestand === 'overgang' && overgangT > 0.35 && overgangT < 1) return;   // in de put verdwenen
  if (k.straling && Math.random() < 0.3) deeltjes.push({ x: rat.x + willekeurig(-20, 30), y: rat.y - willekeurig(5, 30), vx: 0, vy: -40, leven: 0.5, straling: true });
  if (rat.boost > 0) {
    // regenboog-gloed rond het ratje
    const kleur = 'hsla(' + Math.floor(tijd * 360) % 360 + ',100%,60%,';
    const gloed = ctx.createRadialGradient(rat.x + 10, rat.y - 20, 5, rat.x + 10, rat.y - 20, 60);
    gloed.addColorStop(0, kleur + '0.7)');
    gloed.addColorStop(1, kleur + '0)');
    ctx.fillStyle = gloed;
    ctx.fillRect(rat.x - 50, rat.y - 80, 120, 120);
  }
  // knipperen na de superkracht
  if (rat.onkwetsbaar > 0 && Math.floor(tijd * 12) % 2) return;
  tekenRat(rat.x, rat.y, k, ratBukt(), rat.fase);
}

function tekenRioolObstakel(o) {
  const v = o.v;
  if (o.soort === 'val') {
    // een drol, precies zo groot als het stuk waar je tegenaan botst
    const cx = o.x + o.w / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, v + 1, 24, 4, 0, 0, Math.PI * 2); ctx.fill();
    [[0, -5, 22, 6], [0, -12, 16, 6], [1, -18, 10, 5]].forEach(([dx, dy, rx, ry], i) => {
      ctx.fillStyle = '#6b3e1a';
      ctx.beginPath(); ctx.ellipse(cx + dx, v + dy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8f5a2b';
      ctx.beginPath(); ctx.ellipse(cx + dx - rx * 0.3, v + dy - ry * 0.4, rx * 0.45, ry * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = '#6b3e1a';
    ctx.beginPath(); ctx.moveTo(cx - 5, v - 21); ctx.quadraticCurveTo(cx + 2, v - 30, cx + 6, v - 27); ctx.quadraticCurveTo(cx + 4, v - 22, cx + 6, v - 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 6, v - 12, 3.2, 0, Math.PI * 2); ctx.arc(cx + 6, v - 12, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(cx - 5, v - 12, 1.6, 0, Math.PI * 2); ctx.arc(cx + 7, v - 12, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(160,220,90,0.7)'; ctx.lineWidth = 2;   // stinklijntjes
    for (let i = -1; i <= 1; i++) {
      const sx = o.x + o.w / 2 + i * 10, sy = v - 32 + Math.sin(tijd * 5 + i) * 3;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + 5, sy - 6, sx, sy - 12); ctx.stroke();
    }
  } else if (o.soort === 'kist') {
    // twee rollen wc-papier op elkaar
    for (let i = 0; i < 2; i++) {
      const y = v - 20 - i * 20;
      ctx.fillStyle = '#f4f4f0'; ctx.fillRect(o.x + 4, y, o.w - 8, 20);
      ctx.fillStyle = '#d9d9d2'; ctx.fillRect(o.x + 4, y + 16, o.w - 8, 4);
      ctx.fillStyle = '#e8e8e2';
      ctx.beginPath(); ctx.ellipse(o.x + o.w - 4, y + 10, 5, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b89a6a';
      ctx.beginPath(); ctx.ellipse(o.x + o.w - 4, y + 10, 2, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#f4f4f0';   // los velletje
    ctx.fillRect(o.x + 6, v - 4, 14, 4);
  } else if (o.soort === 'stam') {
    // het uiteinde van een dikke rioolbuis
    const cx = o.x + o.r, cy = v - o.r;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, v + 2, o.r, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b766f';
    ctx.beginPath(); ctx.arc(cx, cy, o.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4d5751';
    ctx.beginPath(); ctx.arc(cx, cy, o.r - 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0c120e';
    ctx.beginPath(); ctx.arc(cx, cy, o.r - 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7fd13b';   // groen slijm
    ctx.beginPath(); ctx.ellipse(cx, cy + o.r - 16, 22, 6, 0, 0, Math.PI); ctx.fill();
    ctx.fillRect(cx + 10, cy + o.r - 14, 5, 10 + Math.sin(tijd * 3) * 3);
    if (o.nummer <= 3) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('2x springen! ⬆⬆', cx, cy - o.r - 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  } else {
    // een buis die uit het plafond komt, met een druppel
    const cx = o.x + o.w / 2, onder = v - 30;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, v + 2, o.w / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5f6b63'; ctx.fillRect(cx - 18, 0, 36, onder);
    ctx.fillStyle = '#76837a'; ctx.fillRect(cx - 18, 0, 8, onder);
    ctx.fillStyle = '#4b5650'; ctx.fillRect(cx - 24, onder - 14, 48, 14);
    ctx.fillRect(cx - 24, 60, 48, 10);
    const drup = (tijd * 90) % 40;
    ctx.fillStyle = '#7fd13b';
    ctx.beginPath(); ctx.ellipse(cx, onder + 4 + drup * 0.3, 4, 6, 0, 0, Math.PI * 2); ctx.fill();
    if (o.nummer <= 3) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('⬇ bukken!', cx, v + 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  }
}

function tekenKeukenObstakel(o) {
  const v = o.v;
  if (o.soort === 'val') {
    // peper- en zoutvaatje
    [[o.x + 8, '#f2f2f2', '#c9c9c9'], [o.x + 28, '#3a3a3a', '#222']].forEach(([x, kleur, donker]) => {
      ctx.fillStyle = kleur; ctx.fillRect(x, v - 15, 16, 15);
      ctx.fillStyle = '#b8bfc6'; ctx.fillRect(x - 1, v - 21, 18, 7);
      ctx.fillStyle = donker;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + 4 + i * 4, v - 18, 1, 0, Math.PI * 2); ctx.fill(); }
    });
  } else if (o.soort === 'kist') {
    // messen rechtop in een snijplank
    ctx.fillStyle = '#a8743f'; ctx.fillRect(o.x, v - 10, o.w, 10);
    ctx.fillStyle = '#8a5d30'; ctx.fillRect(o.x, v - 3, o.w, 3);
    [8, 22, 36].forEach((dx, i) => {
      const h = [24, 29, 22][i];   // niet hoger dan het stuk waar je tegenaan botst
      ctx.fillStyle = '#d9e0e6';
      ctx.beginPath(); ctx.moveTo(o.x + dx - 3, v - 10); ctx.lineTo(o.x + dx - 3, v - 10 - h); ctx.lineTo(o.x + dx + 4, v - 10 - h + 8); ctx.lineTo(o.x + dx + 4, v - 10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(o.x + dx - 2, v - 10 - h + 4, 1.5, h - 6);
    });
  } else if (o.soort === 'borden') {
    // een scheve stapel borden met een blauw randje
    for (let i = 0; i < 5; i++) {
      const by = v - 4 - i * 5.5, schuif = Math.sin(i * 2.3) * 3;
      ctx.fillStyle = '#f6f3ec';
      ctx.beginPath(); ctx.ellipse(o.x + o.w / 2 + schuif, by, o.w / 2, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2f7de0'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  } else if (o.soort === 'stam') {
    // een grote ronde soeppan met damp
    const cx = o.x + o.r, cy = v - o.r;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, v + 2, o.r, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b8261c';   // een rode gietijzeren pan
    ctx.beginPath(); ctx.arc(cx, cy + 6, o.r - 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e04a36';
    ctx.beginPath(); ctx.arc(cx - 12, cy - 6, o.r - 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b1d14';   // handvatten en rand
    ctx.fillRect(cx - o.r - 8, cy - 14, 14, 8); ctx.fillRect(cx + o.r - 6, cy - 14, 14, 8);
    ctx.fillStyle = '#7a1a12'; ctx.fillRect(cx - o.r + 4, cy - o.r + 6, (o.r - 4) * 2, 10);
    ctx.fillStyle = '#f08a3c';   // oranje soep die bijna overkookt
    ctx.beginPath(); ctx.ellipse(cx, cy - o.r + 8, o.r - 8, 6, 0, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < 3; k++) {
      const t = (tijd * 0.8 + k / 3) % 1;
      ctx.fillStyle = 'rgba(230,235,240,' + (0.35 * (1 - t)) + ')';
      ctx.beginPath(); ctx.arc(cx - 20 + k * 20, cy - o.r - t * 50, 6 + t * 10, 0, Math.PI * 2); ctx.fill();
    }
    if (o.nummer <= 3) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('2x springen! ⬆⬆', cx, cy - o.r - 40, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  } else {
    // een koekenpan die aan een haak hangt
    const cx = o.x + o.w / 2, onder = v - 30;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, v + 2, o.w / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8a9096'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, onder - 70); ctx.stroke();
    ctx.fillStyle = '#2b2f34'; ctx.fillRect(cx - 4, onder - 72, 8, 36);   // steel
    ctx.fillStyle = '#b8692f';
    ctx.beginPath(); ctx.ellipse(cx, onder - 18, o.w / 2, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d98a4a';
    ctx.beginPath(); ctx.ellipse(cx - 5, onder - 22, o.w / 2 - 10, 13, 0, 0, Math.PI * 2); ctx.fill();
    if (o.nummer <= 3) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('⬇ bukken!', cx, v + 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  }
}

function tekenSalonObstakel(o) {
  const v = o.v;
  if (o.soort === 'val') {
    // een hoopje afgeknipt haar
    [['#6b4423', 0], ['#e8c860', 1], ['#2b2b2b', 2], ['#a0522d', 3]].forEach(([kleur, i]) => {
      ctx.fillStyle = kleur;
      ctx.beginPath(); ctx.ellipse(o.x + 12 + i * 9, v - 7 - (i % 2) * 5, 14, 9, 0, Math.PI, 0); ctx.fill();
    });
    ctx.strokeStyle = '#3a2614'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 6; i++) {
      const sx = o.x + 8 + i * 7;
      ctx.beginPath(); ctx.moveTo(sx, v - 4); ctx.quadraticCurveTo(sx + 6, v - 22, sx + 2, v - 18); ctx.stroke();
    }
  } else if (o.soort === 'kist') {
    // een zoemende tondeuse met een snoer
    const tril = Math.sin(tijd * 70) * 1.2, cx = o.x + o.w / 2 + tril;
    ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, v - 4); ctx.quadraticCurveTo(o.x - 10, v, o.x - 30, v - 2); ctx.stroke();
    ctx.fillStyle = '#2b2b33'; ctx.fillRect(cx - 13, v - 34, 26, 34);
    ctx.fillStyle = '#ff4fa3'; ctx.fillRect(cx - 13, v - 22, 26, 6);
    ctx.fillStyle = '#c9ced4'; ctx.fillRect(cx - 15, v - 40, 30, 7);
    ctx.fillStyle = '#7b828a';
    for (let i = 0; i < 6; i++) ctx.fillRect(cx - 14 + i * 5, v - 43, 2, 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx + 18, v - 34); ctx.lineTo(cx + 24, v - 38); ctx.moveTo(cx + 18, v - 26); ctx.lineTo(cx + 25, v - 26); ctx.stroke();
  } else if (o.soort === 'borden') {
    // een stekker die op zijn rug ligt, met de pinnen omhoog
    const cx = o.x + o.w / 2;
    ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx - 14, v - 6); ctx.quadraticCurveTo(o.x - 6, v - 2, o.x - 26, v - 6); ctx.stroke();
    ctx.fillStyle = '#f5f5f5'; ctx.fillRect(cx - 16, v - 16, 32, 16);
    ctx.fillStyle = '#dcdcdc'; ctx.fillRect(cx - 16, v - 4, 32, 4);
    ctx.fillStyle = '#c9a43a';
    ctx.fillRect(cx - 9, v - 29, 5, 14); ctx.fillRect(cx + 4, v - 29, 5, 14);
  } else if (o.soort === 'stam') {
    // een reuzenkrulspeld, van opzij gezien
    const cx = o.x + o.r, cy = v - o.r;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, v + 2, o.r, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ff9ad0'; ctx.lineWidth = 3;
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (o.r - 10), cy + Math.sin(a) * (o.r - 10)); ctx.lineTo(cx + Math.cos(a) * (o.r - 1), cy + Math.sin(a) * (o.r - 1)); ctx.stroke();
    }
    ctx.fillStyle = '#ff5fa8';
    ctx.beginPath(); ctx.arc(cx, cy, o.r - 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd0e8';
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) { ctx.beginPath(); ctx.arc(cx + Math.cos(a) * (o.r - 24), cy + Math.sin(a) * (o.r - 24), 5, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#3b1d45';
    ctx.beginPath(); ctx.arc(cx, cy, o.r - 38, 0, Math.PI * 2); ctx.fill();
    if (o.nummer <= 3) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('2x springen! ⬆⬆', cx, cy - o.r - 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  } else {
    // een föhn die aan zijn snoer hangt
    const cx = o.x + o.w / 2, onder = v - 30;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, v + 2, o.w / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx + 6, onder - 54); ctx.stroke();
    ctx.fillStyle = '#ff5fa8';
    ctx.fillRect(cx - 4, onder - 56, 18, 34);                   // handvat
    ctx.beginPath(); ctx.ellipse(cx - 2, onder - 14, 30, 16, 0, 0, Math.PI * 2); ctx.fill();   // kop
    ctx.fillStyle = '#c9ced4'; ctx.fillRect(cx - 44, onder - 22, 16, 16);   // mondstuk
    ctx.fillStyle = '#ffd0e8';
    ctx.beginPath(); ctx.arc(cx + 18, onder - 14, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,120,0.6)'; ctx.lineWidth = 2;   // warme lucht
    for (let i = 0; i < 3; i++) {
      const golf = (tijd * 60 + i * 12) % 36;
      ctx.beginPath(); ctx.moveTo(cx - 48 - golf, onder - 18 + i * 5); ctx.lineTo(cx - 58 - golf, onder - 18 + i * 5); ctx.stroke();
    }
    if (o.nummer <= 3) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('⬇ bukken!', cx, v + 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  }
}


function tekenObstakel(o) {
  if (level === 4) return tekenSalonObstakel(o);
  if (level === 3) return tekenKeukenObstakel(o);
  if (level === 2) return tekenRioolObstakel(o);
  if (o.soort === 'val') {
    const x = o.x, y = o.v;
    ctx.fillStyle = '#a0612b';
    ctx.fillRect(x, y - 10, o.w, 10);
    ctx.fillStyle = '#7a4518';
    ctx.fillRect(x, y - 3, o.w, 3);
    ctx.strokeStyle = '#d7dbde'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 8, y - 10); ctx.lineTo(x + 8, y - 22); ctx.lineTo(x + o.w - 8, y - 22); ctx.lineTo(x + o.w - 8, y - 10);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x + o.w / 2, y - 12, 4, 0, Math.PI * 2); ctx.stroke();
    // lokaas
    ctx.fillStyle = '#f5c518';
    ctx.beginPath(); ctx.moveTo(x + o.w / 2 + 6, y - 10); ctx.lineTo(x + o.w / 2 + 16, y - 10); ctx.lineTo(x + o.w / 2 + 16, y - 17); ctx.closePath(); ctx.fill();
  } else if (o.soort === 'kist') {
    const x = o.x, y = o.v, w = o.w, h = o.h;
    ctx.fillStyle = '#6b3a16';
    ctx.fillRect(x, y - h * 0.65, w, h * 0.65);
    ctx.fillStyle = '#86491c';
    ctx.beginPath();
    ctx.moveTo(x, y - h * 0.65); ctx.lineTo(x, y - h * 0.8);
    ctx.quadraticCurveTo(x + w / 2, y - h * 1.1, x + w, y - h * 0.8);
    ctx.lineTo(x + w, y - h * 0.65); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e0b02a';
    ctx.fillRect(x + 6, y - h * 0.9, 5, h * 0.9);
    ctx.fillRect(x + w - 11, y - h * 0.9, 5, h * 0.9);
    ctx.fillRect(x, y - h * 0.67, w, 3);
    ctx.fillRect(x + w / 2 - 5, y - h * 0.7, 10, 11);
    ctx.fillStyle = '#3a1f08';
    ctx.fillRect(x + w / 2 - 1.5, y - h * 0.62, 3, 4);
  } else if (o.soort === 'stam') {
    // een dikke boomstam, van opzij gezien: je kijkt tegen de zaagkant aan
    const cx = o.x + o.r, cy = o.v - o.r;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, o.v + 2, o.r, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5b3a1e';
    ctx.beginPath(); ctx.arc(cx, cy, o.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d9a86a';
    ctx.beginPath(); ctx.arc(cx, cy, o.r - 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#b07f45'; ctx.lineWidth = 2;
    for (let k = 1; k <= 4; k++) { ctx.beginPath(); ctx.arc(cx + k, cy - k, (o.r - 8) * k / 5, 0, Math.PI * 2); ctx.stroke(); }
    ctx.strokeStyle = '#3e2712'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx + 6, cy - 4); ctx.lineTo(cx + 26, cy - 22); ctx.stroke();
    // mosplekje
    ctx.fillStyle = '#5f8f3a';
    ctx.beginPath(); ctx.ellipse(cx - 20, cy - o.r + 4, 18, 6, -0.3, 0, Math.PI * 2); ctx.fill();
    if (o.nummer <= 3) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('2x springen! ⬆⬆', cx, cy - o.r - 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  } else {
    const cx = o.x + o.w / 2, onder = o.v - 30;
    // schaduw op de vloer als waarschuwing
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, o.v + 2, o.w / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    // ketting
    ctx.strokeStyle = '#8a6d1f'; ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, onder - 30); ctx.stroke();
    ctx.setLineDash([]);
    // armen
    ctx.strokeStyle = '#d4a017'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(o.x + 2, onder - 22); ctx.quadraticCurveTo(cx, onder + 4, o.x + o.w - 2, onder - 22); ctx.stroke();
    ctx.fillStyle = '#d4a017';
    ctx.fillRect(cx - 4, onder - 32, 8, 22);
    // kaarsjes
    [o.x + 2, cx, o.x + o.w - 2].forEach((kx, i) => {
      const ky = i === 1 ? onder - 34 : onder - 24;
      ctx.fillStyle = '#f4ead2';
      ctx.fillRect(kx - 3, ky - 12, 6, 12);
      ctx.fillStyle = '#ffb02e';
      ctx.beginPath(); ctx.ellipse(kx, ky - 16, 3, 5 + Math.sin(tijd * 12 + i) * 1, 0, 0, Math.PI * 2); ctx.fill();
    });
    // kristallen
    ctx.fillStyle = '#bfe9ff';
    [-20, -7, 7, 20].forEach(d => {
      const top = onder - 12 + Math.abs(d) * -0.4;
      ctx.beginPath(); ctx.moveTo(cx + d - 3, top); ctx.lineTo(cx + d + 3, top); ctx.lineTo(cx + d, onder - Math.abs(d) * 0.3); ctx.closePath(); ctx.fill();
    });
    // bij de eerste kroonluchters een hint: hier moet je bukken
    if (o.nummer <= 3) {
      const knipper = 0.6 + Math.sin(tijd * 10) * 0.4;
      ctx.globalAlpha = knipper;
      tekst('⬇ bukken!', cx, o.v + 22, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
  }
}

function tekenPut() {
  if (!put) return;
  const cx = put.x + 35, v = put.v;
  if (level === 3) {
    // een muizenhol in een stukje muur: daar ren je in naar de kapsalon
    ctx.fillStyle = '#e8dcc8'; ctx.fillRect(put.x - 20, v - 140, 150, 140);
    ctx.fillStyle = '#c9b89c'; ctx.fillRect(put.x - 20, v - 12, 150, 12);
    ctx.fillStyle = '#1a0f08';
    ctx.beginPath(); ctx.moveTo(put.x + 10, v); ctx.lineTo(put.x + 10, v - 40); ctx.arc(put.x + 45, v - 40, 35, Math.PI, 0); ctx.lineTo(put.x + 80, v); ctx.closePath(); ctx.fill();
    const gloed = ctx.createRadialGradient(put.x + 45, v - 30, 2, put.x + 45, v - 30, 40);
    gloed.addColorStop(0, 'rgba(255,140,220,0.6)'); gloed.addColorStop(1, 'rgba(255,140,220,0)');
    ctx.fillStyle = gloed; ctx.fillRect(put.x + 5, v - 80, 80, 80);
    ctx.globalAlpha = 0.6 + Math.sin(tijd * 8) * 0.4;
    tekst('➜ HET MUIZENHOL', put.x + 45, v - 160, 20, '#ff8ad8');
    ctx.globalAlpha = 1;
    return;
  }
  if (level === 2) {
    // een afvoerpijp uit het plafond: daar schiet je omhoog naar de keuken
    const onder = v - 95;
    const licht = ctx.createLinearGradient(0, onder, 0, v);
    licht.addColorStop(0, 'rgba(255,240,170,0.45)');
    licht.addColorStop(1, 'rgba(255,240,170,0.05)');
    ctx.fillStyle = licht;
    ctx.beginPath(); ctx.moveTo(cx - 30, onder); ctx.lineTo(cx + 30, onder); ctx.lineTo(cx + 55, v); ctx.lineTo(cx - 55, v); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5f6b63'; ctx.fillRect(cx - 34, 0, 68, onder);
    ctx.fillStyle = '#76837a'; ctx.fillRect(cx - 34, 0, 12, onder);
    ctx.fillStyle = '#4b5650'; ctx.fillRect(cx - 42, onder - 16, 84, 16); ctx.fillRect(cx - 42, 70, 84, 12);
    ctx.fillStyle = '#fff6c8';
    ctx.beginPath(); ctx.ellipse(cx, onder, 32, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.6 + Math.sin(tijd * 8) * 0.4;
    tekst('⬆ DE PIJP ⬆', cx, onder + 40, 20, '#ffe680');
    ctx.globalAlpha = 1;
    return;
  }
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, v + 2, 38, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#8a8f93'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(cx, v + 2, 38, 9, 0, 0, Math.PI * 2); ctx.stroke();
  // het deksel staat ernaast
  ctx.fillStyle = '#6e7377';
  ctx.beginPath(); ctx.ellipse(put.x + 100, v - 26, 9, 28, 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4d5155'; ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(put.x + 95, v - 26 + i * 9); ctx.lineTo(put.x + 105, v - 24 + i * 9); ctx.stroke(); }
  // groene gloed uit de put
  const gloed = ctx.createRadialGradient(cx, v, 2, cx, v, 60);
  gloed.addColorStop(0, 'rgba(120,255,80,0.45)');
  gloed.addColorStop(1, 'rgba(120,255,80,0)');
  ctx.fillStyle = gloed; ctx.fillRect(cx - 60, v - 60, 120, 70);
  ctx.globalAlpha = 0.6 + Math.sin(tijd * 8) * 0.4;
  tekst('⬇ DE PUT ⬇', cx, v - 75, 22, '#7dff9a');
  ctx.globalAlpha = 1;
}

function tekenGat(g) {
  // het gat zelf: diep en donker
  const v = g.v;
  const riool = level === 2, keuken = level === 3, salon = level === 4;
  const diepte = ctx.createLinearGradient(0, v, 0, H);
  diepte.addColorStop(0, riool ? '#0e1a10' : keuken ? '#0d0f12' : '#120802');
  diepte.addColorStop(1, '#000');
  ctx.fillStyle = diepte;
  ctx.fillRect(g.x, v, g.w, H - v);
  if (riool) {
    // groen rioolwater met golfjes en belletjes
    const wy = v + 26;
    ctx.fillStyle = '#4fa82a';
    ctx.beginPath(); ctx.moveTo(g.x, H);
    for (let x = g.x; x <= g.x + g.w; x += 8) ctx.lineTo(x, wy + Math.sin(x * 0.08 + tijd * 4) * 3);
    ctx.lineTo(g.x + g.w, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(200,255,150,0.6)';
    for (let i = 0; i < g.w / 40; i++) {
      const bx = g.x + 15 + i * 40 + Math.sin(i * 7) * 8, by = wy + 8 + ((tijd * 25 + i * 13) % 30);
      ctx.beginPath(); ctx.arc(bx, H - (by - wy), 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (salon) {
    // een wasbak vol shampoo met schuim
    const wy = v + 24;
    ctx.fillStyle = '#7fd6ff'; ctx.fillRect(g.x, wy, g.w, H - wy);
    ctx.fillStyle = '#ffffff';
    for (let x = g.x + 8; x < g.x + g.w - 4; x += 16) {
      ctx.beginPath(); ctx.arc(x, wy + Math.sin(x * 0.2 + tijd * 3) * 2, 9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < g.w / 30; i++) {
      const bx = g.x + 12 + i * 30, by = wy + 20 + ((tijd * 20 + i * 11) % 30);
      ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (keuken) {
    // een gasfornuis: rooster en blauwe vlammetjes
    const by = v + 34;
    ctx.fillStyle = '#1b1e22'; ctx.fillRect(g.x, by, g.w, H - by);
    for (let x = g.x + 18; x < g.x + g.w - 10; x += 26) {
      const hoog = 9 + Math.sin(tijd * 20 + x) * 3;
      ctx.fillStyle = '#2f8fff';
      ctx.beginPath(); ctx.moveTo(x - 6, by); ctx.quadraticCurveTo(x, by - hoog * 2, x + 6, by); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#a8dcff';
      ctx.beginPath(); ctx.moveTo(x - 3, by); ctx.quadraticCurveTo(x, by - hoog, x + 3, by); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = '#3a3f45'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(g.x, by - 22); ctx.lineTo(g.x + g.w, by - 22); ctx.stroke();
    for (let x = g.x + 30; x < g.x + g.w; x += 60) { ctx.beginPath(); ctx.moveTo(x, by - 22); ctx.lineTo(x, by); ctx.stroke(); }
  }
  ctx.fillStyle = riool ? '#2a302c' : keuken ? '#7a4c28' : salon ? '#cfc8d8' : '#5a3816';
  ctx.fillRect(g.x - 4, v, 4, H - v);
  ctx.fillRect(g.x + g.w, v, 4, H - v);
  ctx.fillStyle = riool ? '#7fd13b' : keuken ? '#e8bf84' : salon ? '#ff6ac1' : '#d4a017';
  ctx.fillRect(g.x - 6, v, 6, 3);
  ctx.fillRect(g.x + g.w, v, 6, 3);

  // met superkracht ren je over een regenboogbrug
  if (rat.boost > 0) {
    const kleuren = ['#ff4d4d', '#ffa64d', '#ffe14d', '#5ce65c', '#4db8ff', '#a64dff'];
    kleuren.forEach((k, i) => { ctx.fillStyle = k; ctx.fillRect(g.x, v + i * 3, g.w, 3); });
  }
  if (g.trampX === null) return;

  // de trampoline (in de keuken een spons)
  const tx = g.trampX, tw = g.trampW, indruk = g.indruk > 0 ? 6 * g.indruk / 0.3 : 0;
  if (salon) {
    // een stapel zachte handdoeken als trampoline
    ['#ff8ad8', '#ffffff', '#8ad8ff'].forEach((kleur, i) => {
      const top = g.v - 8 - i * 7 + indruk * (i + 1) / 3;
      ctx.fillStyle = kleur; ctx.fillRect(tx, top, tw, 8);
      ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(tx, top + 6, tw, 2);
    });
    if (g.nummer <= 2) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('Handdoeken! ⬇', tx + tw / 2, g.v - 60, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
    return;
  }
  if (keuken) {
    const top = g.v - 22 + indruk;
    ctx.fillStyle = '#ffd84a'; ctx.fillRect(tx, top + 7, tw, g.v - top - 7);
    ctx.fillStyle = '#3fae49'; ctx.fillRect(tx, top, tw, 8);
    ctx.fillStyle = 'rgba(160,110,0,0.5)';
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(tx + 7 + i * 8.5, top + 13 + (i % 2) * 4, 2, 0, Math.PI * 2); ctx.fill(); }
    if (g.nummer <= 2) {
      ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
      tekst('Spons! ⬇', tx + tw / 2, g.v - 60, 18, '#7dff9a');
      ctx.globalAlpha = 1;
    }
    return;
  }
  const G = g.v, mat = G - 14 + indruk;   // de trampoline staat op de vloer bij het gat
  ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(tx + 6, G); ctx.lineTo(tx + 10, G - 12);
  ctx.moveTo(tx + tw - 6, G); ctx.lineTo(tx + tw - 10, G - 12);
  ctx.stroke();
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const vx = tx + 10 + i * (tw - 20) / 4;
    ctx.beginPath(); ctx.moveTo(vx, G - 12); ctx.lineTo(vx, mat); ctx.stroke();
  }
  ctx.fillStyle = '#1b1b1b';
  ctx.beginPath(); ctx.ellipse(tx + tw / 2, mat, tw / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e02424'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(tx + tw / 2, mat, tw / 2, 5, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#2f7de0'; ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.ellipse(tx + tw / 2, mat, tw / 2, 5, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // bij de eerste gaten een hint
  if (g.nummer <= 2) {
    ctx.globalAlpha = 0.6 + Math.sin(tijd * 10) * 0.4;
    tekst('Trampoline! ⬇', tx + tw / 2, G - 60, 18, '#7dff9a');
    ctx.globalAlpha = 1;
  }
}

function tekenClown() {
  const y = vloerY(rat.x) - (voet.til || 0);
  const bx = Math.min(voet.x, voetRust());          // waar zijn lijf staat
  const neus = voet.x + VOET_B;                      // de punt van zijn grote schoen
  const wiebel = Math.sin(tijd * 9) * 3;

  // de rode ballon aan een touwtje
  const ballonX = bx + 92 + Math.sin(tijd * 1.7) * 6, ballonY = y - 190 + Math.sin(tijd * 2.3) * 5;
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(bx + 78, y - 86); ctx.quadraticCurveTo(bx + 95, y - 130, ballonX, ballonY + 24); ctx.stroke();
  ctx.fillStyle = '#e8141e';
  ctx.beginPath(); ctx.ellipse(ballonX, ballonY, 19, 23, 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ballonX - 4, ballonY + 26); ctx.lineTo(ballonX + 4, ballonY + 26); ctx.lineTo(ballonX, ballonY + 21); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(ballonX - 7, ballonY - 8, 5, 8, 0.4, 0, Math.PI * 2); ctx.fill();

  // achterste schoen
  ctx.fillStyle = '#d61f1f';
  ctx.beginPath(); ctx.ellipse(bx + 30 - wiebel, y - 9, 26, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(bx + 6 - wiebel, y - 3, 48, 3);

  // voorste been: een rekbaar gestreept been naar de grote schoen
  const heup = { x: bx + 52, y: y - 34 }, hiel = { x: neus - 58, y: y - 12 };
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#2f7de0'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(heup.x, heup.y); ctx.lineTo(hiel.x, hiel.y); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.setLineDash([5, 7]);
  ctx.beginPath(); ctx.moveTo(heup.x, heup.y); ctx.lineTo(hiel.x, hiel.y); ctx.stroke();
  ctx.setLineDash([]);

  // de grote clownsschoen
  ctx.fillStyle = '#d61f1f';
  ctx.beginPath(); ctx.ellipse(neus - 32, y - 10, 32, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(neus - 13, y - 15, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(neus - 62, y - 3, 60, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(neus - 16, y - 19, 4, 0, Math.PI * 2); ctx.fill();

  // broek met stippen
  ctx.fillStyle = '#2f7de0';
  ctx.fillRect(bx + 14, y - 78, 56, 50);
  ctx.fillStyle = '#ffd23f';
  [[24, -68], [48, -60], [36, -44], [60, -40], [22, -38]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(bx + dx, y + dy, 4, 0, Math.PI * 2); ctx.fill(); });
  // gele bloes
  ctx.fillStyle = '#ffcf26';
  ctx.beginPath(); ctx.ellipse(bx + 42, y - 92, 28, 22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8141e';
  [-100, -90, -80].forEach(dy => { ctx.beginPath(); ctx.arc(bx + 44, y + dy, 3, 0, Math.PI * 2); ctx.fill(); });
  // arm met handschoen die de ballon vasthoudt
  ctx.strokeStyle = '#ffcf26'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(bx + 62, y - 100); ctx.lineTo(bx + 76, y - 88); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(bx + 78, y - 86, 6, 0, Math.PI * 2); ctx.fill();
  // kraag
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  for (let i = 0; i <= 8; i++) ctx.lineTo(bx + 20 + i * 5.5, y - 112 + (i % 2) * 7);
  ctx.lineTo(bx + 64, y - 106); ctx.lineTo(bx + 20, y - 106); ctx.closePath(); ctx.fill();

  // hoofd
  const hx = bx + 44, hy = y - 132;
  ctx.fillStyle = '#ff7a1a';   // oranje haar
  [[-18, -6], [-21, 6], [18, -6], [21, 6]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(hx + dx, hy + dy, 10, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(hx, hy, 19, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1f6fd6';   // klein hoedje
  ctx.beginPath(); ctx.moveTo(hx - 9, hy - 16); ctx.lineTo(hx + 9, hy - 16); ctx.lineTo(hx + 2, hy - 38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(hx + 2, hy - 39, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';      // ogen kijken naar het ratje
  ctx.beginPath(); ctx.arc(hx + 2, hy - 5, 2.6, 0, Math.PI * 2); ctx.arc(hx + 11, hy - 5, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2b62c4'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(hx + 2, hy - 12); ctx.lineTo(hx + 2, hy - 2); ctx.moveTo(hx + 11, hy - 12); ctx.lineTo(hx + 11, hy - 2); ctx.stroke();
  ctx.strokeStyle = '#e8141e'; ctx.lineWidth = 3;   // grote lach
  ctx.beginPath(); ctx.arc(hx + 4, hy + 2, 10, 0.2, Math.PI - 0.4); ctx.stroke();
  ctx.fillStyle = '#e8141e';   // rode neus
  ctx.beginPath(); ctx.arc(hx + 16, hy + 1, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(hx + 14, hy - 1, 1.8, 0, Math.PI * 2); ctx.fill();
}

function tekenKat() {
  const y = vloerY(rat.x) - (voet.til || 0);
  const bx = Math.min(voet.x, voetRust());   // waar zijn lijf staat
  const klauw = voet.x + VOET_B;              // de punt van zijn poot
  const boos = voet.fase === 'aftellen' || voet.fase === 'aanloop' || voet.fase === 'trap';
  const vacht = '#2c2c33', licht = '#45454f';

  // staart, die heen en weer zwiept
  ctx.strokeStyle = vacht; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx + 8, y - 40);
  ctx.quadraticCurveTo(bx - 30, y - 60 + Math.sin(tijd * 4) * 10, bx - 18 + Math.sin(tijd * 3) * 12, y - 118);
  ctx.stroke();
  // achterpoot en lijf (gebogen als hij aanvalt)
  ctx.fillStyle = vacht;
  ctx.beginPath(); ctx.ellipse(bx + 22, y - 12, 18, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx + 50, y - (boos ? 50 : 42), 50, boos ? 30 : 26, boos ? -0.12 : 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = licht;
  ctx.beginPath(); ctx.ellipse(bx + 55, y - 32, 30, 10, 0, 0, Math.PI * 2); ctx.fill();
  // voorpoot met klauw, naar het ratje toe
  ctx.strokeStyle = vacht; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.moveTo(bx + 82, y - 38); ctx.lineTo(klauw - 14, y - 9); ctx.stroke();
  ctx.fillStyle = vacht;
  ctx.beginPath(); ctx.ellipse(klauw - 12, y - 9, 15, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 2;
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(klauw - 2, y - 9 + i * 4); ctx.lineTo(klauw + 6, y - 11 + i * 5); ctx.stroke(); }
  // kop
  const hx = bx + 102, hy = y - 72;
  ctx.fillStyle = vacht;
  ctx.beginPath(); ctx.moveTo(hx - 22, hy - 12); ctx.lineTo(hx - 16, hy - 40); ctx.lineTo(hx - 2, hy - 20); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 4, hy - 20); ctx.lineTo(hx + 18, hy - 40); ctx.lineTo(hx + 24, hy - 10); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(hx, hy, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e88aa0';
  ctx.beginPath(); ctx.moveTo(hx - 18, hy - 16); ctx.lineTo(hx - 15, hy - 32); ctx.lineTo(hx - 7, hy - 19); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 8, hy - 19); ctx.lineTo(hx + 17, hy - 32); ctx.lineTo(hx + 19, hy - 14); ctx.closePath(); ctx.fill();
  // gloeiende ogen met spleetjes
  ctx.fillStyle = '#c6ff3a';
  ctx.beginPath(); ctx.ellipse(hx - 4, hy - 5, 7, boos ? 5 : 7, 0, 0, Math.PI * 2); ctx.ellipse(hx + 14, hy - 5, 7, boos ? 5 : 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.ellipse(hx - 2, hy - 5, 1.8, 5, 0, 0, Math.PI * 2); ctx.ellipse(hx + 16, hy - 5, 1.8, 5, 0, 0, Math.PI * 2); ctx.fill();
  // neus, bek en snorharen
  ctx.fillStyle = '#e88aa0';
  ctx.beginPath(); ctx.moveTo(hx + 18, hy + 6); ctx.lineTo(hx + 24, hy + 6); ctx.lineTo(hx + 21, hy + 10); ctx.closePath(); ctx.fill();
  if (boos) {
    ctx.fillStyle = '#5a0f1a';
    ctx.beginPath(); ctx.ellipse(hx + 16, hy + 15, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(hx + 9, hy + 11); ctx.lineTo(hx + 11, hy + 18); ctx.lineTo(hx + 13, hy + 11); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx + 19, hy + 11); ctx.lineTo(hx + 21, hy + 18); ctx.lineTo(hx + 23, hy + 11); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(hx + 22, hy + 8); ctx.lineTo(hx + 44, hy + 2);
  ctx.moveTo(hx + 22, hy + 10); ctx.lineTo(hx + 44, hy + 12);
  ctx.stroke();
}

function tekenSchaar() {
  // een reuzenschaar die op zijn punten achter je aan huppelt en over de vloer knipt
  const y = vloerY(rat.x) - (voet.til || 0);
  const neus = voet.x + VOET_B;                       // de punt van de schaar
  const aanval = voet.fase === 'trap' || voet.fase === 'aanloop';
  const open = aanval ? 0.25 + Math.abs(Math.sin(tijd * 28)) * 0.35 : 0.18 + Math.abs(Math.sin(tijd * 6)) * 0.12;
  const scharnier = { x: neus - 70, y: y - 18 };
  ctx.save();
  ctx.translate(scharnier.x, scharnier.y);
  // de twee helften: elk een lemmet naar voren en een roze oog naar achteren
  [-1, 1].forEach(kant => {
    ctx.save();
    ctx.rotate(kant * open);
    ctx.fillStyle = '#dfe5ea';
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(70, kant * 1); ctx.lineTo(0, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.moveTo(4, -2); ctx.lineTo(60, 0); ctx.lineTo(4, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ff4fa3'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.ellipse(-34, kant * -6, 20, 13, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  });
  ctx.fillStyle = '#8a929a';
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-1, -1, 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // boze oogjes op de handvatten
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(scharnier.x - 30, scharnier.y - 12, 5, 0, Math.PI * 2); ctx.arc(scharnier.x - 30, scharnier.y + 4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(scharnier.x - 28, scharnier.y - 12, 2.2, 0, Math.PI * 2); ctx.arc(scharnier.x - 28, scharnier.y + 4, 2.2, 0, Math.PI * 2); ctx.fill();
  if (aanval) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;   // knip-streepjes
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(neus + 4, y - 18 + i * 8); ctx.lineTo(neus + 14, y - 18 + i * 11); ctx.stroke(); }
  }
}


function tekenVoet() {
  if (!voet.actief) return;
  if (voet.soort === 'schaar') { tekenSchaar(); tekenTrapWaarschuwing(); return; }
  if (voet.soort === 'kat') { tekenKat(); tekenTrapWaarschuwing(); return; }
  if (voet.soort === 'clown') { tekenClown(); tekenTrapWaarschuwing(); return; }
  const vloerOnder = vloerY(rat.x), x = voet.x, til = voet.til || 0;
  const zool = vloerOnder - til;
  // been (spijkerbroek) van boven het scherm
  ctx.fillStyle = '#2f4f86';
  ctx.fillRect(x + 8, -10, 58, zool - 40);
  ctx.fillStyle = '#26406d';
  ctx.fillRect(x + 8, zool - 62, 58, 10);
  // sok
  ctx.fillStyle = '#f2f2f2';
  ctx.fillRect(x + 12, zool - 52, 50, 14);
  // schoen
  ctx.fillStyle = '#e02424';
  ctx.beginPath();
  ctx.moveTo(x + 6, zool - 8);
  ctx.lineTo(x + 6, zool - 42);
  ctx.lineTo(x + 66, zool - 42);
  ctx.quadraticCurveTo(x + 80, zool - 30, VOET_B + x - 18, zool - 28);
  ctx.quadraticCurveTo(x + VOET_B + 2, zool - 24, x + VOET_B, zool - 8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 4, zool - 9, VOET_B - 2, 9);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x + 62 + i * 9, zool - 38 + i * 3); ctx.lineTo(x + 70 + i * 9, zool - 30 + i * 3); ctx.stroke(); }
  tekenTrapWaarschuwing();
}
function tekenTrapWaarschuwing() {
  // aftellen tot je moet springen: 2... 1... SPRING!
  const x = rat.x + 10, y = rat.y - 82;
  if (voet.fase === 'aftellen') {
    const over = INSTELLINGEN.aftellen - voet.t;
    tekst('Spring over ' + Math.ceil(over), x, y, 24, '#ffd23f');
    // balkje dat leegloopt
    const bw = 90;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x - bw / 2, y + 18, bw, 8);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - bw / 2, y + 18, bw * over / INSTELLINGEN.aftellen, 8);
  } else if (voet.fase === 'aanloop') {
    const groot = 30 + Math.sin(tijd * 30) * 3;
    tekst('SPRING!', x, y, groot, '#ff4d4d');
  }
}

function tekenLekker(l) {
  const y = l.y + Math.sin(tijd * 4 + l.fase) * 3;
  if (l.goud || l.speciaal) {
    const kleur = l.speciaal ? 'hsla(' + Math.floor(tijd * 300) % 360 + ',100%,65%,' : 'rgba(255,230,90,';
    const r = l.speciaal ? 40 : 30;
    const gloed = ctx.createRadialGradient(l.x, y, 2, l.x, y, r);
    gloed.addColorStop(0, kleur + '0.9)');
    gloed.addColorStop(1, kleur + '0)');
    ctx.fillStyle = gloed;
    ctx.fillRect(l.x - r, y - r, r * 2, r * 2);
  }
  ctx.save();
  ctx.translate(l.x, y);
  if (l.speciaal) ctx.rotate(Math.sin(tijd * 6) * 0.3);
  ctx.font = (l.speciaal ? 38 : l.goud ? 34 : 28) + 'px ' + EMOJI;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(l.soort, 0, 0);
  ctx.restore();
}

function tekenDeeltjes() {
  deeltjes.forEach(d => {
    ctx.globalAlpha = Math.min(1, d.leven * 2);
    if (d.straling) {
      ctx.fillStyle = '#8dff5a';
      ctx.beginPath(); ctx.arc(d.x, d.y, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (d.ster) {
      ctx.fillStyle = '#ffe680';
      ctx.fillRect(d.x - 2, d.y - 2, 4, 4);
    } else if (d.regenboog) {
      ctx.fillStyle = 'hsl(' + Math.floor((d.x + d.y + tijd * 300) % 360) + ',100%,65%)';
      ctx.beginPath(); ctx.arc(d.x, d.y, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (d.wolkje) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(d.x, d.y, 5, 0, Math.PI * 2); ctx.fill();
    } else if (d.groot) {
      tekst(d.tekst, d.x, d.y, 34, '#ff6a3d');
    } else {
      tekst(d.tekst, d.x, d.y, 20, d.goud ? '#ffe14d' : '#fff');
    }
  });
  ctx.globalAlpha = 1;
}

function tekst(t, x, y, grootte, kleur = '#fff', uitlijnen = 'center', dik = true) {
  ctx.font = (dik ? '800 ' : '600 ') + grootte + 'px system-ui, -apple-system, sans-serif';
  ctx.textAlign = uitlijnen; ctx.textBaseline = 'middle';
  ctx.lineWidth = grootte / 6; ctx.strokeStyle = 'rgba(30,12,0,0.85)'; ctx.lineJoin = 'round';
  ctx.strokeText(t, x, y);
  ctx.fillStyle = kleur;
  ctx.fillText(t, x, y);
}


function tekenScore() {
  tekst('🧀 ' + score, 18, 30, 26, '#ffe14d', 'left');
  tekst(Math.floor(afstand / 40) + ' m', W / 2, 30, 20, '#fff');
  tekst(['', 'Level 1: de schatkamer', 'Level 2: het riool', 'Level 3: de keuken', 'Level 4: de kapsalon'][level], W / 2, 52, 13, ['', '#ffd27a', '#9dff6a', '#ffb27a', '#ff8ad8'][level], 'center', false);
  const uitgang = ['', 'put', 'pijp', 'muizenhol'][level];
  if (put) tekst('Nog ' + Math.max(0, Math.ceil((put.x - rat.x) / 40)) + ' m tot de ' + uitgang, W - 18, 54, 16, '#9dff6a', 'right');
  else if (level < 4) tekst(['', 'Put', 'Pijp', 'Muizenhol'][level] + ' bij ' + UITGANG(level) + ' 🧀', W - 18, 54, 15, '#9dff6a', 'right', false);
  tekst('Record ' + recordVan(level), W - 18, 30, 18, '#ffd27a', 'right', false);
  if (voet.actief && voet.tijd > 0) tekst(({ voet: '🦶 ', clown: '🤡 ', kat: '🐈 ', schaar: '✂️ ' }[voet.soort]) + Math.ceil(voet.tijd), 18, 62, 20, '#ff9a7a', 'left');
  if (rat.boost > 0) {
    // balk die laat zien hoe lang de superkracht nog duurt
    const bw = 200, bx = W / 2 - bw / 2, by = 66;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, bw, 12);
    ctx.fillStyle = 'hsl(' + Math.floor(tijd * 360) % 360 + ',100%,60%)';
    ctx.fillRect(bx, by, bw * Math.min(1, rat.boost / INSTELLINGEN.boostDuur), 12);
    tekst('🍭 SUPERKRACHT  x2', W / 2, by + 28, 16, '#fff');
  }
}

function tekenMenu() {
  ctx.fillStyle = 'rgba(20,8,0,0.5)';
  ctx.fillRect(0, 0, W, H);
  tekst('KAAS ROYALE', W / 2, 52, 48, '#ffd23f');
  const ondertitels = {};
  ['', 'Pak al het lekkers en ontsnap via de put naar het riool!', 'Spring over de poep, ontwijk de clown en zoek de pijp!', 'Pas op voor de messen, de hete pannen en de kat!', 'Spring over het haar en de stekkers, en pas op voor de schaar!'].forEach((t, i) => { if (i) ondertitels[i] = t; });
  tekst(ondertitels[slide], W / 2, 92, 16, '#fff', 'center', false);

  // naam van het level, met pijltjes naar de andere slides en een bolletje per slide
  const namen = { 1: 'LEVEL 1: DE SCHATKAMER', 2: 'LEVEL 2: HET RIOOL', 3: 'LEVEL 3: DE KEUKEN', 4: 'LEVEL 4: DE KAPSALON' };
  const kleuren = { 1: '#ffd23f', 2: '#9dff6a', 3: '#ffb27a', 4: '#ff8ad8' };
  const kleur = kleuren[slide], max = hoogsteSlide();
  tekst(namen[slide], W / 2, PIJL_Y, 24, kleur);
  const alle = slideLijst();
  if (alle.length > 1) {
    const knipper = 0.55 + Math.sin(tijd * 5) * 0.45, volgende = buurSlide(1), vorige = buurSlide(-1);
    if (volgende) { ctx.globalAlpha = knipper; tekst('LEVEL ' + volgende + '  ›', W / 2 + 215, PIJL_Y, 20, kleuren[volgende]); ctx.globalAlpha = 1; }
    if (vorige) tekst('‹  LEVEL ' + vorige, W / 2 - 215, PIJL_Y, 20, kleuren[vorige]);
    alle.forEach((n, i) => {
      ctx.fillStyle = n === slide ? kleur : 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(W / 2 + (i - (alle.length - 1) / 2) * 18, PIJL_Y + 22, 4.5, 0, Math.PI * 2); ctx.fill();
    });
  }
  if (slide === max && max < 4) {
    tekst('🔒 Level ' + (max + 1) + ': haal ' + UITGANG(max) + ' punten in level ' + max, W / 2, PIJL_Y + (max > 1 ? 40 : 24), 14, kleuren[max + 1], 'center', false);
  }
  tekst(meldingTijd > 0 ? melding : 'Kies je ratje' + (slide > 1 ? '  ·  record ' + recordVan(slide) : ''), W / 2, 200, 19, meldingTijd > 0 ? '#ff9a7a' : '#ffe9b0', 'center', meldingTijd <= 0);

  ratPlekken().forEach(({ k, x, y, vak, grootte }, i) => {
    if (RATJES.indexOf(k) === gekozen) {
      ctx.fillStyle = 'rgba(255,210,63,0.25)';
      ctx.beginPath(); ctx.ellipse(x + 10 * grootte, y + 6, 55 * grootte, 10, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (ratOpen(k)) {
      tekenRat(x, y, k, false, tijd * 4 + i * 2, grootte);
      tekst(k.naam, x + 10 * grootte, y + 22 + 6 * grootte, Math.min(19, vak / 6), '#fff');
    } else {
      // nog op slot: alleen een schaduw
      ctx.globalAlpha = 0.6;
      tekenRat(x, y, { vacht: '#140a03', buik: '#140a03', roze: '#140a03' }, false, 0, grootte);
      ctx.globalAlpha = 1;
      tekst('🔒', x + 5 * grootte, y - 27 * grootte, 22);
      tekst(ratLevel(k) === 1 ? k.nodig + ' punten' : k.nodig + ' in level ' + ratLevel(k), x + 10 * grootte, y + 22 + 6 * grootte, Math.min(14, vak / 7.5), '#ffd27a', 'center', false);
    }
  });
  tekst(hoogsteSlide() > 1 ? 'Veeg opzij voor een ander level  ·  tik op je ratje om te starten' : 'Tik = springen  ·  2x tikken = hoger  ·  veeg omlaag = bukken', W / 2, H - 12, 14, '#e8cfa0', 'center', false);
  tekst('versie ' + VERSIE, W - 8, H - 12, 11, '#8a7a60', 'right', false);
}

function tekenAf() {
  ctx.fillStyle = 'rgba(20,8,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  tekst(oorzaak, W / 2, 80, 34, '#ff8a5c');
  tekst('Je pakte ' + score + ' punten', W / 2, 132, 28, '#ffe14d');
  if (nieuwRecord) tekst('Nieuw record! 🏆', W / 2, 172, 24, '#7dff9a');
  else tekst('Record in level ' + level + ': ' + recordVan(level), W / 2, 172, 20, '#ffd27a', 'center', false);
  if (vrijgespeeld.length) {
    tekst('Nieuw ratje vrijgespeeld: ' + vrijgespeeld.map(k => k.naam).join(' en ') + '! 🐀', W / 2, 214, 22, '#7dd8ff');
  } else {
    const volgende = RATJES.find(k => ratLevel(k) === level && k.nodig > recordVan(level));
    if (volgende) tekst('Nog ' + (volgende.nodig - recordVan(level)) + ' punten in level ' + level + ' tot ' + volgende.naam, W / 2, 214, 18, '#e8cfa0', 'center', false);
  }
  if (afSinds > 0.7) tekst('Tik om verder te gaan', W / 2, 264, 22, '#fff', 'center', false);
}

function tekenDraaiTelefoon() {
  ctx.fillStyle = 'rgba(20,8,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  tekst('📱 ↻', W / 2, H / 2 - 40, 44, '#fff');
  tekst('Draai je telefoon', W / 2, H / 2 + 20, 22, '#ffd23f');
  tekst('dwars', W / 2, H / 2 + 50, 22, '#ffd23f');
}

function tekenen() {
  ctx.save();
  if (schudden > 0) ctx.translate(willekeurig(-6, 6) * schudden * 3, willekeurig(-6, 6) * schudden * 3);
  tekenAchtergrond();

  if (toestand !== 'menu') {
    gaten.forEach(tekenGat);
    tekenPut();
    lekkers.forEach(tekenLekker);
    dingen.forEach(tekenObstakel);
    tekenVoet();
    tekenSpeler();
    tekenDeeltjes();
    tekenScore();
  }
  ctx.restore();

  if (toestand === 'menu') tekenMenu();
  if (toestand === 'af') tekenAf();
  if (toestand === 'overgang') {
    // het scherm wordt zwart en weer licht, met in het midden het nieuwe level
    const t = overgangT;
    ctx.globalAlpha = t < 1 ? t : Math.max(0, 1 - (t - 1.4) / 1);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    if (t > 0.6 && t < 2.3) {
      const n = levelGewisseld ? level : level + 1;
      tekst('LEVEL ' + n, W / 2, H / 2 - 30, 54, ['', '', '#7dff9a', '#ffb27a', '#ff8ad8'][n]);
      tekst(['', '', 'Het riool 🐀', 'De keuken 🍲', 'De kapsalon 💇'][n], W / 2, H / 2 + 25, 26, '#fff');
      tekst('Je punten beginnen opnieuw', W / 2, H / 2 + 62, 18, '#e8cfa0', 'center', false);
      if (vrijgespeeld.length) tekst('Nieuw ratje: ' + vrijgespeeld.map(k => k.naam).join(' en ') + '! 🐀', W / 2, H / 2 + 96, 20, '#7dd8ff');
    }
  }
  if (W < 480) tekenDraaiTelefoon();
}

// ----- Automatisch bijwerken -----
// Telefoons bewaren soms lang een oude versie. Bij het starten (en als je het spel weer opent)
// kijken we of er online een nieuwere versie staat; zo ja, dan laden we die meteen.
function zoekNieuweVersie() {
  if (typeof fetch === 'undefined' || toestand === 'spelen') return;
  fetch('index.html?controle=' + Date.now(), { cache: 'no-store' })
    .then(r => r.text())
    .then(html => {
      const m = html.match(/const VERSIE = (\d+)/);
      if (m && Number(m[1]) > VERSIE) location.replace(location.pathname + '?v=' + m[1]);
    })
    .catch(() => {});   // geen internet: gewoon verder spelen
}
zoekNieuweVersie();
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('visibilitychange', () => { if (!document.hidden) zoekNieuweVersie(); });
}

// ----- De spellus -----
let vorige = performance.now();
function lus(nu) {
  const dt = Math.min(0.05, (nu - vorige) / 1000);
  vorige = nu;
  if (W >= 480) bijwerken(dt);
  tekenen();
  requestAnimationFrame(lus);
}
requestAnimationFrame(lus);
</script>
