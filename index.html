<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a1606">
<title>Kaas Royale</title>
<meta name="apple-mobile-web-app-title" content="Kaas Royale">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; background: #2a1606; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  /* het invulvak voor de geheime code */
  #codeVak { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,4,0,0.75); }
  #codeVak[hidden] { display: none; }
  #codeVak form { background: #3d2108; border: 3px solid #ffcc33; border-radius: 16px; padding: 18px; display: flex; gap: 10px; align-items: center; }
  #codeVak input { font: 700 20px system-ui, sans-serif; padding: 10px 12px; border-radius: 10px; border: 0; width: 210px;
    -webkit-user-select: text; user-select: text; }
  #codeVak button { font: 800 18px system-ui, sans-serif; padding: 10px 14px; border-radius: 10px; border: 0; background: #ffcc33; color: #2a1200; }
  #codeVak button.weg { background: #6b4a2a; color: #fff; }
</style>
</head>
<body>
<canvas id="spel"></canvas>
<div id="codeVak" hidden>
  <form id="codeForm" autocomplete="off">
    <input id="codeInvoer" type="text" placeholder="Geheime code" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button type="submit">OK</button>
    <button type="button" class="weg" id="codeWeg">✕</button>
  </form>
</div>
<script>
// =====================================================================
//  KAAS ROYALE - versie 32
//  Een ratje rent door een schatkamer vol lekkers.
//  Tik = springen, 2x tikken = hoger springen, veeg omlaag = bukken.
//  Op de computer: spatie of pijltje omhoog = springen, pijltje omlaag = bukken.
// =====================================================================

// ----- Getallen om mee te spelen: verander ze en kijk wat er gebeurt! -----
const INSTELLINGEN = {
  startSnelheid: 260,      // hoe snel het ratje begint (pixels per seconde)
  versnelling: 5,          // hoeveel sneller het elke seconde gaat
  maxSnelheid: 650,        // sneller dan dit wordt het niet
  springKracht: 640,       // hoe hoog je springt
  dubbelSprongKracht: 650, // hoe hoog de tweede sprong in de lucht is
  zwaartekracht: 1800,     // hoe hard je weer naar beneden valt
  bukTijd: 0.8,            // hoeveel seconden je bukt na omlaag vegen
  kansOpGoud: 0.08,        // kans op gouden kaas (0 = nooit, 1 = altijd)
  puntenLekker: 2,         // punten voor elk snoepje
  puntenGoud: 10,          // punten voor gouden kaas
  // bij zoveel punten kom je bij de uitgang naar het volgende level (put, pijp, muizenhol)
  uitgangPunten: [0, 500, 500, 600],
  snoepjeElke: 18,         // om de hoeveel seconden er ongeveer een superlolly komt
  boostDuur: 5,            // hoeveel seconden de superkracht duurt
  boostSnelheid: 1.5,      // hoeveel keer zo snel je gaat met superkracht
  gatKans: 0.18,           // kans dat er een gat met trampoline komt (0 tot 1)
  gatLengte: 1.4,          // hoe lang het gat is (in seconden rennen)
  vliegZwaartekracht: 600, // lager = langer zweven na de trampoline
  kleinGatKans: 0.15,      // kans op een klein gat waar je overheen springt
  boomstamKans: 0.12,      // kans op een boomstam (alleen met 2x springen eroverheen)
  hoogteVerschil: 45,      // hoe hoog een opstapje in de vloer is
  voetElke: 14,            // om de hoeveel seconden de voet (level 1) of de clown (level 2) komt
  voetDuur: 8,             // hoeveel seconden de voet achter je aan zit
  aftellen: 2,             // hoeveel seconden het spel aftelt voordat de voet trapt
};

// ----- De ratjes: bij genoeg punten (je record in dat level) speel je een nieuw ratje vrij -----
const RATJES = [
  { naam: 'Snuf',   nodig: 0,   vacht: '#9b9b9b', buik: '#dcdcdc', roze: '#f2a7b5' },
  { naam: 'Pepper', nodig: 50,  vacht: '#7a4a2a', buik: '#c99f78', roze: '#f2a7b5' },
  { naam: 'Ninja',  nodig: 150, vacht: '#2b2b33', buik: '#55556a', roze: '#f2a7b5', band: '#e02424' },
  { naam: 'Goudje', nodig: 300, vacht: '#d9a520', buik: '#f6dd8a', roze: '#f7b3c0', kroon: true },
  { naam: 'Radio',  nodig: 500, vacht: '#4cff3a', buik: '#b8ff9e', roze: '#c8ff7a', straling: true },
  // ratjes voor level 2 (punten in het riool)
  { naam: 'Poeprat', nodig: 150, level: 2, vacht: '#6b4423', buik: '#a8794c', roze: '#e8a0a8', poep: true },
  { naam: 'WC-rat',  nodig: 300, level: 2, vacht: '#eeebe3', buik: '#ffffff', roze: '#f2a7b5', wcpapier: true },
  { naam: 'Slijmrat', nodig: 450, level: 2, vacht: '#3f8f2a', buik: '#8fe04a', roze: '#c8ff7a', slijm: true },
  // ratjes voor level 3 (punten in de keuken)
  { naam: 'Chef',    nodig: 150, level: 3, vacht: '#7c8796', buik: '#c5ccd6', roze: '#f2a7b5', koksmuts: true },
  { naam: 'Hotdog',  nodig: 400, level: 3, vacht: '#c4553a', buik: '#d9704f', roze: '#f2a7b5', hotdog: true },
  { naam: 'Aangebrand', nodig: 600, level: 3, vacht: '#1c1a19', buik: '#34302d', roze: '#6b5a55', verbrand: true },
  // ratjes voor level 4 (punten in de kapsalon)
  { naam: 'Krul',    nodig: 0,   level: 4, vacht: '#9b9b9b', buik: '#dcdcdc', roze: '#f2a7b5', krullen: true },
  { naam: 'Rapunzel', nodig: 200, level: 4, vacht: '#a89a8c', buik: '#ddd2c4', roze: '#f2a7b5', langHaar: true },
  { naam: 'Low Taper', nodig: 400, level: 4, vacht: '#8f8f95', buik: '#d4d4d8', roze: '#f2a7b5', fade: true },
];

// ----- Het lekkers in de schatkamer -----
const LEKKERS = ['🧀', '🍰', '🍪', '🍩', '🍓', '🧁', '🍫', '🥐', '🍕'];
const SALON_LEKKERS = ['🧀', '🍬', '🍩', '🍪', '🧁', '🍫', '🍰', '🍓'];   // level 4
const KEUKEN_LEKKERS = ['🍗', '🍔', '🧀', '🥐', '🥖', '🍅', '🌭', '🍕', '🧁', '🍗', '🍔'];   // level 3; de gouden bonus is een pan ratatouille 🍲
const SUPERSNOEPJE = '🍭';

// =====================================================================
//  Vanaf hier: de motor van het spel
// =====================================================================
const canvas = document.getElementById('spel');
const ctx = canvas.getContext('2d');
const H = 400;          // het spel is altijd 400 hoog; de breedte past zich aan
const G = H - 70;       // hoogte van de vloer
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
let W = 700, schaal = 1;

function maatAanpassen() {
  const dpr = window.devicePixelRatio || 1;
  const bw = window.innerWidth, bh = window.innerHeight;
  schaal = bh / H;
  W = bw / schaal;
  canvas.width = Math.round(bw * dpr);
  canvas.height = Math.round(bh * dpr);
  ctx.setTransform(schaal * dpr, 0, 0, schaal * dpr, 0, 0);
}
window.addEventListener('resize', maatAanpassen);
maatAanpassen();

// ----- Toestand van het spel -----
let toestand = 'menu';   // 'menu', 'spelen', 'overgang' (naar het volgende level) of 'af'
let level = 1, levelStart = 0, put = null, overgangT = 0, levelGewisseld = false;
let rat, dingen = [], lekkers = [], deeltjes = [], gaten = [];
let snelheid, afstand, score, volgendObstakel, volgendLekker, volgendSnoepje, springBuffer, luchtersGezien;
let gatenGezien, tijdSindsGat, stammenGezien, voetenGezien;
let vloer = [], voet = { actief: false }, voetTimer = 0;
let scrollX = 0, tijd = 0, afSinds = 0, schudden = 0, oorzaak = '', nieuwRecord = false, vrijgespeeld = [];
let melding = '', meldingTijd = 0;
let record = Number(localStorage.getItem('kaasRoyaleRecord')) || 0;      // record in level 1
let record2 = Number(localStorage.getItem('kaasRoyaleRecord2')) || 0;    // record in level 2
let record3 = Number(localStorage.getItem('kaasRoyaleRecord3')) || 0;    // record in level 3
let record4 = Number(localStorage.getItem('kaasRoyaleRecord4')) || 0;    // record in level 4
const UITGANG = level => INSTELLINGEN.uitgangPunten[level] || Infinity;
let gekozen = Number(localStorage.getItem('kaasRoyaleRatje')) || 0;
const ratLevel = k => k.level || 1;
const recordVan = n => [0, record, record2, record3, record4][n];
const ratOpen = k => recordVan(ratLevel(k)) >= k.nodig;
const VERSIE = 32;
// level 2 blijft open: ook als je record ooit hoog genoeg was
let level2Open = localStorage.getItem('kaasRoyaleLevel2') === '1' || record >= UITGANG(1);
let level3Open = localStorage.getItem('kaasRoyaleLevel3') === '1' || record2 >= UITGANG(2);
let level4Open = localStorage.getItem('kaasRoyaleLevel4') === '1' || record3 >= UITGANG(3);
const hoogsteSlide = () => level4Open ? 4 : level3Open ? 3 : level2Open ? 2 : 1;
// Vraag de browser om de opgeslagen punten en levels nooit zomaar op te ruimen
if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
function openLevel(n) {
  if (n === 2 && !level2Open) { level2Open = true; localStorage.setItem('kaasRoyaleLevel2', '1'); }
  if (n === 3 && !level3Open) { level3Open = true; localStorage.setItem('kaasRoyaleLevel3', '1'); }
  if (n === 4 && !level4Open) { level4Open = true; localStorage.setItem('kaasRoyaleLevel4', '1'); }
  // de volgende keer begin je in het hoogste level dat je gehaald hebt
  if (n > (Number(localStorage.getItem('kaasRoyaleStartLevel')) || 1)) { slide = n; localStorage.setItem('kaasRoyaleStartLevel', String(n)); }
}
// het beginscherm heeft een slide per level; level 2 komt erbij als je hem gehaald hebt
// alle slides op een rij: level 1 tot je hoogste level
function slideLijst() {
  const lijst = [];
  for (let n = 1; n <= hoogsteSlide(); n++) lijst.push(n);
  return lijst;
}
const bewaardeSlide = Number(localStorage.getItem('kaasRoyaleStartLevel')) || 1;
let slide = slideLijst().includes(bewaardeSlide) ? bewaardeSlide : Math.min(hoogsteSlide(), bewaardeSlide);
level = slide;   // het menu laat de achtergrond van dat level zien
if (!RATJES[gekozen] || !ratOpen(RATJES[gekozen])) gekozen = 0;
let omlaagIngedrukt = false, vingerOmlaag = false;

const RAT_X = 140;        // waar het ratje rent

function nieuwSpel() {
  rat = { x: RAT_X, y: G, vy: 0, opGrond: true, dubbel: false, vliegt: false, bukken: 0, fase: 0, boost: 0, onkwetsbaar: 0, coyote: 0 };
  dingen = []; lekkers = []; deeltjes = []; gaten = [];
  snelheid = INSTELLINGEN.startSnelheid;
  afstand = 0; score = 0; springBuffer = 0; luchtersGezien = 0; gatenGezien = 0; tijdSindsGat = 0;
  stammenGezien = 0; voetenGezien = 0;
  vloer = [{ x: -200, w: W + 900, h: 0 }];
  vloerAanvullen();
  voet = { actief: false };
  voetTimer = INSTELLINGEN.voetElke;
  level = 1; levelStart = 0; put = null;
  volgendObstakel = 1.4; volgendLekker = 0.4;
  volgendSnoepje = willekeurig(8, 12);   // de eerste komt wat sneller
  nieuwRecord = false; vrijgespeeld = [];
  toestand = 'spelen';
}

const willekeurig = (a, b) => a + Math.random() * (b - a);
const kies = lijst => lijst[Math.floor(Math.random() * lijst.length)];
function hash(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

// ----- Geluid (gemaakt met de computer, geen bestanden nodig) -----
let audio = null;
function startAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audio && audio.state === 'suspended') audio.resume();
}
function piep(toon, duur, soort = 'square', volume = 0.07, glijNaar = 0, wacht = 0) {
  if (!audio) return;
  const t = audio.currentTime + wacht;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = soort;
  o.frequency.setValueAtTime(toon, t);
  if (glijNaar) o.frequency.exponentialRampToValueAtTime(glijNaar, t + duur);
  g.gain.setValueAtTime(volume, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + duur);
  o.connect(g); g.connect(audio.destination);
  o.start(t); o.stop(t + duur);
}

// ----- Besturing -----
function springen() {
  if (toestand !== 'spelen') return;
  if (rat.opGrond || (rat.coyote > 0 && !rat.vliegt)) {
    rat.vy = -INSTELLINGEN.springKracht;
    rat.opGrond = false;
    rat.coyote = 0;
    rat.dubbel = false;
    rat.bukken = 0;
    piep(320, 0.15, 'square', 0.05, 640);
  } else if (!rat.dubbel) {
    // tweede tik in de lucht: nog een keer omhoog
    rat.vy = -INSTELLINGEN.dubbelSprongKracht;
    rat.dubbel = true;
    rat.bukken = 0;
    piep(480, 0.15, 'square', 0.05, 960);
    for (let i = 0; i < 6; i++) deeltjes.push({ x: rat.x - 5, y: rat.y, vx: willekeurig(-90, 90), vy: willekeurig(20, 90), leven: 0.35, wolkje: true });
  } else {
    springBuffer = 0.12; // net te vroeg getikt? dan springt hij zodra hij landt
  }
}
function bukken() {
  if (toestand !== 'spelen') return;
  rat.bukken = INSTELLINGEN.bukTijd;
  if (!rat.opGrond && !rat.vliegt) rat.vy = Math.max(rat.vy, 700); // snel naar beneden
  piep(220, 0.1, 'triangle', 0.05, 140);
}

// Welk vakje in het menu hoort bij deze plek?
// Welke ratjes staan op deze slide? De ratjes van dit level en de levels ervoor
function slideRatjes(n = slide) {
  return RATJES.filter(k => ratLevel(k) <= n);
}
// Waar staat elk ratje op het beginscherm? Bij meer dan 6 ratjes in twee rijen
const RIJ_Y = [258, 340];
function ratPlekken() {
  const lijst = slideRatjes(), rijen = lijst.length > 6 ? 2 : 1, perRij = Math.ceil(lijst.length / rijen);
  return lijst.map((k, i) => {
    const rij = Math.floor(i / perRij), kol = i % perRij;
    const inRij = rij === rijen - 1 ? lijst.length - rij * perRij : perRij;
    const vak = W / inRij;
    const grootte = rijen === 2 ? Math.min(0.95, vak / 125) : Math.min(1.5, vak / 125);
    return { k, rij, vak, grootte, x: vak * (kol + 0.5) - 8 * grootte, y: rijen === 2 ? RIJ_Y[rij] : G - 8 };
  });
}
function menuVakje(x, y = G) {
  const plekken = ratPlekken(), tweeRijen = plekken.some(p => p.rij === 1);
  const rij = tweeRijen && y > (RIJ_Y[0] + RIJ_Y[1]) / 2 - 18 ? 1 : 0;
  const inRij = plekken.filter(p => p.rij === rij);
  const kol = Math.max(0, Math.min(inRij.length - 1, Math.floor(x / (W / inRij.length))));
  return plekken.indexOf(inRij[kol]);
}
// Naar de andere slide van het beginscherm
const PIJL_Y = 142;
function naarSlide(n) {
  if (!slideLijst().includes(n) || n === slide) return;
  slide = n;
  level = n;
  localStorage.setItem('kaasRoyaleStartLevel', String(n));
  piep([0, 520, 330, 420, 620][n], 0.1, 'triangle', 0.06);
}
function buurSlide(stap) {
  const lijst = slideLijst(), i = lijst.indexOf(slide);
  return lijst[i + stap];
}
// Geheime code. Hier staat alleen een versleutelde versie van het wachtwoord.
const GEHEIM = '2e5303c4fd7225bc1561f4945f5e458b35e36f4ccd2a31426a375339e97e66ff';
let titelTikken = [];
// Een eigen SHA-256, zodat de code op elke telefoon werkt (de code zelf staat nergens in het spel)
function sha256(tekst) {
  const rotr = (v, n) => (v >>> n) | (v << (32 - n));
  const K = [], begin = [];
  const priem = x => { for (let d = 2; d * d <= x; d++) if (x % d === 0) return false; return true; };
  for (let p = 2, n = 0; n < 64; p++) {
    if (!priem(p)) continue;
    if (n < 8) begin[n] = (Math.pow(p, 1 / 2) * 4294967296) | 0;
    K[n++] = (Math.pow(p, 1 / 3) * 4294967296) | 0;
  }
  let bytes = unescape(encodeURIComponent(tekst));
  const lengte = bytes.length * 8;
  bytes += '\x80';
  while (bytes.length % 64 - 56) bytes += '\x00';
  const woorden = [];
  for (let i = 0; i < bytes.length; i++) woorden[i >> 2] |= bytes.charCodeAt(i) << ((3 - i) % 4) * 8;
  woorden.push((lengte / 4294967296) | 0, lengte | 0);
  const hash = begin.slice();
  for (let j = 0; j < woorden.length;) {
    const w = woorden.slice(j, j += 16), oud = hash.slice();
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      if (i >= 16) w[i] = (w[i - 16] + (rotr(w15, 7) ^ rotr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rotr(w2, 17) ^ rotr(w2, 19) ^ (w2 >>> 10))) | 0;
      const t1 = hash[7] + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + K[i] + (w[i] | 0);
      const t2 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash.unshift((t1 + t2) | 0);
      hash[4] = (hash[4] + t1) | 0;
      hash.length = 8;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oud[i]) | 0;
  }
  return hash.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

const codeVak = document.getElementById('codeVak');
const codeInvoer = document.getElementById('codeInvoer');
function vraagGeheimeCode() {
  codeInvoer.value = '';
  codeVak.hidden = false;
  codeInvoer.focus();
}
function sluitCodeVak() {
  codeVak.hidden = true;
  codeInvoer.blur();
}
document.getElementById('codeWeg').addEventListener('click', sluitCodeVak);
document.getElementById('codeForm').addEventListener('submit', e => {
  e.preventDefault();
  // kleine letters, en spaties en onzichtbare tekens die de telefoon soms toevoegt tellen niet mee
  const code = codeInvoer.value.normalize('NFKC').toLowerCase().replace(/[\s\u200B-\u200D\u2060\uFEFF]/g, '');
  sluitCodeVak();
  if (code) controleerCode(code);
});
function controleerCode(code) {
  const hex = sha256(code);
  if (hex === GEHEIM) {
    openLevel(2); openLevel(3); openLevel(4);
    melding = '🔓 Alle levels zijn open';
    [523, 659, 784, 1047].forEach((t, i) => piep(t, 0.14, 'square', 0.06, 0, i * 0.08));
  } else {
    return;   // verkeerde code: er gebeurt niets, zodat niemand ziet dat er een code bestaat
  }
  meldingTijd = 4;
}
function tikBuitenSpel(x, y = H) {
  startAudio();
  if (toestand === 'menu' && x > W - 110 && y > H - 34) {   // het kleine versienummer rechtsonder
    const nu = performance.now();
    titelTikken = titelTikken.filter(t => nu - t < 2500).concat(nu);
    if (titelTikken.length >= 5) { titelTikken = []; vraagGeheimeCode(); }
    return;
  }
  if (toestand === 'menu') {
    // tik op een pijltje bij de naam van het level
    if (slideLijst().length > 1 && Math.abs(y - PIJL_Y) < 26) {
      if (x < W / 2 - 120) { naarSlide(buurSlide(-1)); return; }
      if (x > W / 2 + 120) { naarSlide(buurSlide(1)); return; }
    }
    const lijst = slideRatjes(), k = lijst[menuVakje(x, y)];
    if (ratOpen(k)) {
      gekozen = RATJES.indexOf(k);
      localStorage.setItem('kaasRoyaleRatje', String(gekozen));
      nieuwSpel();
      if (slide > 1) startLevel(slide);
    } else {
      melding = '🔒 ' + k.naam + ': haal eerst ' + k.nodig + ' punten in level ' + ratLevel(k);
      meldingTijd = 2.2;
      piep(180, 0.15, 'square', 0.05);
    }
  } else if (toestand === 'af' && afSinds > 0.7) {
    // terug naar het beginscherm, op de slide van het level waar je net was
    toestand = 'menu';
    slide = level;
    localStorage.setItem('kaasRoyaleStartLevel', String(slide));
  }
}

let veegStartY = null, geveegd = false, menuStart = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  startAudio();
  const t = e.changedTouches[0];
  if (toestand !== 'spelen') { menuStart = { x: t.clientX / schaal, y: t.clientY / schaal }; veegStartY = null; return; }
  veegStartY = t.clientY; geveegd = false;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (veegStartY === null || geveegd) return;
  if (e.changedTouches[0].clientY - veegStartY > 20) { geveegd = true; vingerOmlaag = true; bukken(); }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (menuStart && toestand !== 'spelen') {

// ----- De vloer: stukken met verschillende hoogtes -----
function vloerHoogte(x) {
  for (const s of vloer) if (x >= s.x && x < s.x + s.w) return s.h;
  return 0;
}
function vloerY(x) { return G - vloerHoogte(x); }
function levelAfstand() { return level === 1 ? afstand : afstand - levelStart + 2500; }

// Maakt steeds nieuwe stukken vloer, ver buiten beeld
function vloerAanvullen() {
  const stap = INSTELLINGEN.hoogteVerschil;
  let laatste = vloer[vloer.length - 1];
  while (laatste.x + laatste.w < W + 1600) {
    let h = 0;
    if (levelAfstand() + laatste.x > 2000 && Math.random() < 0.75) {
      h = kies([0, stap, stap * 2].filter(k => k <= laatste.h + stap)); // nooit meer dan 1 opstapje omhoog
    }
    laatste = { x: laatste.x + laatste.w, w: willekeurig(450, 1000), h };
    vloer.push(laatste);
  }
}
function knipVloer(x) {
  const i = vloer.findIndex(s => x > s.x && x < s.x + s.w);
  if (i < 0) return;
  const s = vloer[i];
  vloer.splice(i + 1, 0, { x, w: s.x + s.w - x, h: s.h });
  s.w = x - s.x;
}
// Maakt de vloer van x1 tot x2 vlak (voor obstakels en gaten) en geeft de hoogte terug (als y)
function maakVlak(x1, x2) {
  const h = vloerHoogte(x1);
  knipVloer(x1); knipVloer(x2);
  vloer.forEach(s => { if (s.x >= x1 && s.x < x2) s.h = h; });
  for (let i = 1; i < vloer.length; i++) {
    const max = vloer[i - 1].h + INSTELLINGEN.hoogteVerschil;
    if (vloer[i].x >= x2 && vloer[i].h > max) vloer[i].h = max;
  }
  return G - h;
}

// ----- Obstakels en lekkers maken -----
const NIEUW_X = () => W + 120;   // nieuwe dingen beginnen hier, net buiten beeld

// Een groot gat in de vloer, met ervoor een trampoline die je eroverheen lanceert
function maakGat() {

    const hoogte = vy * t - INSTELLINGEN.vliegZwaartekracht * t * t / 2;

}
function boveGat(x) {
  if (rat && rat.boost > 0) return false; // met superkracht ren je over een regenboog

// De voet trapt alleen als er verder niets aankomt, anders is het niet eerlijk
function ietsDichtbij() {

function voetBijwerken(dt) {

    }

    voet.wacht = false;
    if (voet.t >= INSTELLINGEN.aftellen) { voet.fase = 'aanloop'; voet.t = 0; piep(990, 0.15, 'triangle', 0.08); }
  } else if (voet.fase === 'aanloop') {
    voet.x = rust - 50 * Math.min(1, voet.t / 0.45);
    if (voet.t >= 0.5) { voet.fase = 'trap'; voet.t = 0; if (voet.soort === 'clown') toeter(); else if (voet.soort === 'kat') miauw(false); else if (voet.soort === 'schaar') knip(2); else piep(200, 0.2, 'sawtooth', 0.06, 90); }

    if (voet.x < -VOET_B - 100) voet = { actief: false };

}

function maakLekker(x, y) {

// ----- Botsen -----
function ratVak(r, bukt) {
  return bukt
    ? { l: r.x - 24, r: r.x + 40, b: r.y - 17, o: r.y }
    : { l: r.x - 20, r: r.x + 36, b: r.y - 36, o: r.y };
}
function obstakelVak(o) {
  if (o.soort === 'luchter') return { l: o.x + 4, r: o.x + o.w - 4, b: 0, o: o.v - 30 };

}
const raakt = (a, b) => a.l < b.r && a.r > b.l && a.b < b.o && a.o > b.b;
function botst(vak, o) {
  if (o.soort !== 'stam') return raakt(vak, obstakelVak(o));
  // de boomstam is rond: kijk hoe dicht het ratje bij het midden komt
  const cx = o.x + o.r, cy = o.v - o.r;
  const px = Math.max(vak.l, Math.min(cx, vak.r)), py = Math.max(vak.b, Math.min(cy, vak.o));

function ratBukt() { return rat.bukken > 0 || omlaagIngedrukt || vingerOmlaag; }

// ----- Bijwerken, elk beeldje opnieuw -----
function bijwerken(dt) {
  tijd += dt;
  schudden = Math.max(0, schudden - dt);
  meldingTijd = Math.max(0, meldingTijd - dt);
  deeltjes.forEach(d => { d.y += d.vy * dt; d.x += (d.vx || 0) * dt; d.leven -= dt; });
  deeltjes = deeltjes.filter(d => d.leven > 0);

  if (toestand === 'menu') { scrollX += 40 * dt; return; }
  if (toestand === 'overgang') {
    overgangT += dt;
    // in de put naar beneden (level 1), of door de pijp omhoog (level 2)
    if (overgangT < 1) { rat.x += (put.x + 20 - rat.x) * Math.min(1, 8 * dt); if (level === 2) rat.y -= 380 * dt; else if (level === 1) rat.y += 260 * dt; }   // omlaag de put in, omhoog de pijp in, of het muizenhol in
    if (overgangT >= 1 && !levelGewisseld) { levelGewisseld = true; startLevel(level + 1); }
    if (overgangT >= 2.4) toestand = 'spelen';
    return;
  }
  if (toestand === 'af') { afSinds += dt; return; }

  // tijdens de superkracht wordt het spel niet sneller, zodat je daarna weer je gewone snelheid hebt
  if (rat.boost <= 0) snelheid = Math.min(INSTELLINGEN.maxSnelheid, snelheid + INSTELLINGEN.versnelling * dt);
  const dx = snelheid * (rat.boost > 0 ? INSTELLINGEN.boostSnelheid : 1) * dt;
  afstand += dx;
  scrollX += dx;

  // Superkracht en knipperen daarna
  if (rat.boost > 0) {
    rat.boost -= dt;
    if (Math.random() < 0.6) deeltjes.push({ x: rat.x - 20, y: rat.y - willekeurig(5, 35), vx: -200, vy: willekeurig(-30, 30), leven: 0.4, regenboog: true });
    if (rat.boost <= 0) { rat.boost = 0; rat.onkwetsbaar = 1.2; piep(600, 0.3, 'triangle', 0.06, 300); }
  }
  rat.onkwetsbaar = Math.max(0, rat.onkwetsbaar - dt);

  // Het ratje
  const vorigeY = rat.y;
  rat.vy += (rat.vliegt ? INSTELLINGEN.vliegZwaartekracht : INSTELLINGEN.zwaartekracht) * dt;
  rat.y += rat.vy * dt;
  if (rat.opGrond) rat.coyote = 0.1;   // net van een randje af? dan mag je nog even springen
  rat.coyote = Math.max(0, rat.coyote - dt);

  // het ratje staat op de hoogste vloer onder zijn achter- of voorpootjes
  const steun = Math.min(grondY(rat.x - 10), grondY(rat.x + 30));
  // landen kan alleen als je vlak hiervoor nog boven de vloer was (anders zit je al in een gat)
  if (rat.y >= steun && vorigeY <= steun + 2) {
    rat.y = steun; rat.vy = 0; rat.opGrond = true; rat.dubbel = false; rat.vliegt = false;
    if (springBuffer > 0) { springBuffer = 0; springen(); }
  }
  if (rat.y > H + 40) { af('gat'); return; }

  // Tegen een opstapje aan gelopen?
  const voorX = rat.x + 38;
  if (!boveGat(voorX) && vloerY(voorX) < rat.y - 4) {
    const bijnaBoven = rat.y - vloerY(voorX) <= 24 && rat.vy >= 0;   // net te laag geland? dan klautert hij erop
    if (rat.boost > 0 || rat.onkwetsbaar > 0 || bijnaBoven) {
      rat.y = vloerY(voorX); rat.vy = 0; rat.opGrond = true; rat.dubbel = false; rat.vliegt = false;
    }
    else { af(boveGat(rat.x) || boveGat(rat.x - 10) ? 'gat' : 'muur'); return; }
  }

  // Op de trampoline? Dan vlieg je over het gat
  for (const g of gaten) {
    if (g.trampX === null) continue;
    g.indruk = Math.max(0, g.indruk - dt);
    const opTrampoline = rat.x + 36 > g.trampX + 4 && rat.x - 20 < g.trampX + g.trampW - 4;
    if (opTrampoline && rat.vy >= 0 && rat.y >= g.v - 20 && !rat.vliegt) {
      const T = (g.x + g.w + 60 - rat.x) / snelheid;
      rat.vy = -INSTELLINGEN.vliegZwaartekracht * T / 2;
      rat.vliegt = true; rat.opGrond = false; rat.dubbel = true; rat.bukken = 0;
      g.indruk = 0.3;
      piep(140, 0.45, 'sine', 0.14, 700);
      deeltjes.push({ x: g.trampX + g.trampW / 2, y: g.v - 40, vy: -60, leven: 0.8, tekst: 'BOING!', goud: true });
    }
  }
  springBuffer = Math.max(0, springBuffer - dt);
  rat.bukken = Math.max(0, rat.bukken - dt);
  if (rat.opGrond) rat.fase += dx / 14;

  // Nieuwe dingen maken
  tijdSindsGat += dt;
  if (!put && score >= UITGANG(level)) maakPut();
  // terwijl de voet aftelt en trapt komen er geen nieuwe obstakels
  if (voet.actief && (voet.wacht || ['aftellen', 'aanloop', 'trap'].includes(voet.fase))) volgendObstakel = Math.max(volgendObstakel, 0.4);
  volgendObstakel -= dt;
  if (volgendObstakel <= 0) {
    volgendObstakel = willekeurig(0.95, 1.8);
    const r = Math.random(), I = INSTELLINGEN, la = levelAfstand();
    if (la > 2500 && tijdSindsGat > 9 && r < I.gatKans) maakGat();
    else if (la > 1200 && r < I.gatKans + I.kleinGatKans) maakKleinGat();
    else if (la > 1800 && r < I.gatKans + I.kleinGatKans + I.boomstamKans) maakObstakel('stam');
    else maakObstakel();
  }
  const bezet = x => dingen.some(o => x > o.x - 60 && x < o.x + o.w + 60)
    || gaten.some(g => x > (g.trampX === null ? g.x : g.trampX) - 40 && x < g.x + g.w + 40);
  volgendLekker -= dt;
  if (volgendLekker <= 0) {
    const x = W + 30;
    if (!bezet(x)) maakLekker(x, vloerY(x) - (Math.random() < 0.6 ? 22 : 95));
    volgendLekker = willekeurig(0.35, 0.9);
  }
  volgendSnoepje -= dt;
  if (volgendSnoepje <= 0 && !bezet(W + 30)) {
    lekkers.push({ x: W + 30, y: vloerY(W + 30) - 115, soort: SUPERSNOEPJE, speciaal: true, fase: 0 });
    volgendSnoepje = INSTELLINGEN.snoepjeElke * willekeurig(0.8, 1.3);
  }

  // Alles schuift naar links
  dingen.forEach(o => { o.x -= dx; });
  lekkers.forEach(l => { l.x -= dx; });
  vloer.forEach(s => { s.x -= dx; });
  vloer = vloer.filter(s => s.x + s.w > -300);
  vloerAanvullen();
  gaten.forEach(g => { g.x -= dx; if (g.trampX !== null) g.trampX -= dx; });
  if (put) {
    put.x -= dx;
    if (rat.x >= put.x + 25) {   // in de put: op naar level 2!
      toestand = 'overgang'; overgangT = 0; levelGewisseld = false;
      [400, 300, 200, 120].forEach((t, i) => piep(t, 0.25, 'triangle', 0.08, 0, i * 0.15));
      return;
    }
  }
  gaten = gaten.filter(g => g.x + g.w > -80);

  // De grote voet
  voetBijwerken(dt);
  if (voet.actief && voet.fase === 'trap' && raakt(ratVak(rat, ratBukt()), voetVak())) {
    if (rat.boost > 0) {
      if (!voet.geraakt) { voet.geraakt = true; deeltjes.push({ x: rat.x, y: rat.y - 60, vy: -60, leven: 0.7, tekst: 'HAHA! 🌈', goud: true }); }
    } else if (rat.onkwetsbaar <= 0) { af(voet.soort); return; }
  }
  if (voet.fase !== 'trap') voet.geraakt = false;
  dingen = dingen.filter(o => o.x + o.w > -80);
  lekkers = lekkers.filter(l => l.x > -40 && !l.gepakt);

  // Lekkers pakken
  const mondX = rat.x + 30, mondY = rat.y - (ratBukt() ? 12 : 22);
  lekkers.forEach(l => {
    // met superkracht vliegt het lekkers naar je toe
    if (rat.boost > 0 && l.x > mondX - 20 && l.x - mondX < 260) {
      l.x += (mondX - l.x) * Math.min(1, 6 * dt);
      l.y += (mondY - l.y) * Math.min(1, 6 * dt);
    }
    if (Math.hypot(l.x - mondX, l.y - mondY) < 34) pakLekker(l);
  });

  // Botsen met een obstakel?
  const mijnVak = ratVak(rat, ratBukt());
  for (const o of dingen) {
    if (!botst(mijnVak, o)) continue;
    if (rat.boost > 0) { kapot(o); continue; }
    if (rat.onkwetsbaar > 0) continue;
    af(o.soort);
    break;
  }
  dingen = dingen.filter(o => !o.kapot);
}

function startSuperkracht(x, y) {
  rat.boost = INSTELLINGEN.boostDuur;
  rat.onkwetsbaar = 0;
  deeltjes.push({ x, y: y - 10, vy: -50, leven: 1.2, tekst: 'SUPERKRACHT!', goud: true });

}
function pakLekker(l) {
  l.gepakt = true;
  if (l.speciaal) { startSuperkracht(l.x, l.y); return; }
  const punten = (l.goud ? INSTELLINGEN.puntenGoud : INSTELLINGEN.puntenLekker) * (rat.boost > 0 ? 2 : 1);
  score += punten;
  deeltjes.push({ x: l.x, y: l.y, vy: -70, leven: 0.8, tekst: '+' + punten, goud: l.goud });

  } else {
    piep(880, 0.08, 'triangle', 0.08, 1320);

}

// Bewaar je punten als record van dit level, en kijk of er nieuwe ratjes vrij zijn
function bewaarRecord() {
  const oud = recordVan(level);
  vrijgespeeld = RATJES.filter(k => ratLevel(k) === level && k.nodig > oud && k.nodig <= score);
  nieuwRecord = score > oud;
  if (!nieuwRecord) return;
  if (level === 4) { record4 = score; localStorage.setItem('kaasRoyaleRecord4', String(record4)); }
  else if (level === 3) {
    record3 = score;
    localStorage.setItem('kaasRoyaleRecord3', String(record3));
    if (record3 >= UITGANG(3)) openLevel(4);
  }
  else if (level === 2) {
    record2 = score;
    localStorage.setItem('kaasRoyaleRecord2', String(record2));
    if (record2 >= UITGANG(2)) openLevel(3);
  } else {
    record = score;
    localStorage.setItem('kaasRoyaleRecord', String(record));
    if (record >= UITGANG(1)) openLevel(2);
  }
}

function tekenSchatkamer() {
  const lucht = ctx.createLinearGradient(0, 0, 0, G);
  lucht.addColorStop(0, '#1f0f04');
  lucht.addColorStop(1, '#4a2a0e');
  ctx.fillStyle = lucht;
  ctx.fillRect(0, 0, W, G);

  // Pilaren met fakkels (bewegen langzaam: ver weg)
  const p = scrollX * 0.35, tussen = 260;
  for (let i = Math.floor(p / tussen) - 1; i * tussen - p < W + tussen; i++) {
    const x = i * tussen - p;
    ctx.fillStyle = '#3a200b';
    ctx.fillRect(x, 30, 42, G - 30);
    ctx.fillStyle = '#4a2a10';
    ctx.fillRect(x + 6, 30, 8, G - 30);
    ctx.fillStyle = '#2c1707';
    ctx.fillRect(x - 6, 22, 54, 14);
    // fakkel
    const fy = 120, fx = x + 21, flakker = Math.sin(tijd * 13 + i) * 2 + Math.sin(tijd * 7 + i * 3) * 1.5;
    const gloed = ctx.createRadialGradient(fx, fy - 10, 2, fx, fy - 10, 70);
    gloed.addColorStop(0, 'rgba(255,190,80,0.35)');
    gloed.addColorStop(1, 'rgba(255,190,80,0)');
    ctx.fillStyle = gloed;
    ctx.fillRect(fx - 70, fy - 80, 140, 140);
    ctx.fillStyle = '#6b4a2a';
    ctx.fillRect(fx - 3, fy, 6, 18);
    ctx.fillStyle = '#ff9a1f';
    ctx.beginPath(); ctx.ellipse(fx, fy - 7, 7, 12 + flakker, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath(); ctx.ellipse(fx, fy - 4, 3.5, 7 + flakker / 2, 0, 0, Math.PI * 2); ctx.fill();
  }

  // Bergen goud (bewegen sneller: dichterbij)
  const q = scrollX * 0.6, tussen2 = 340;
  for (let i = Math.floor(q / tussen2) - 1; i * tussen2 - q < W + tussen2; i++) {
    const x = i * tussen2 - q + hash(i) * 120;
    const w = 60 + hash(i + 50) * 50, h = 30 + hash(i + 90) * 30;
    ctx.fillStyle = '#9c6f0c';
    ctx.beginPath(); ctx.ellipse(x, G, w, h, 0, Math.PI, 0); ctx.fill();
    for (let k = 0; k < 14; k++) {
      const rx = (hash(i * 31 + k) - 0.5) * 1.7;
      const cx = x + rx * w;
      const maxH = h * Math.sqrt(Math.max(0, 1 - rx * rx));
      const cy = G - hash(i * 17 + k) * maxH * 0.9 - 2;
      ctx.fillStyle = k % 3 ? '#e8b923' : '#ffd84d';
      ctx.beginPath(); ctx.ellipse(cx, cy, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    // een edelsteen bovenop
    const kleuren = ['#e0315a', '#2fb7e0', '#3ccf6e', '#a35be8'];
    ctx.fillStyle = kleuren[Math.abs(i) % 4];
    ctx.beginPath();
    ctx.moveTo(x, G - h - 12); ctx.lineTo(x + 8, G - h - 2); ctx.lineTo(x, G - h + 6); ctx.lineTo(x - 8, G - h - 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(x - 2, G - h - 7, 3, 3);
  }

}

function tekenVloer() {
  // Vloer, in stukken met verschillende hoogtes
  // schatkamer: hout en goud; riool: beton en slijm; keuken: een stalen aanrecht
  const [kleurVloer, kleurRand, kleurNaad] = [null, ['#3b2410', '#d4a017', '#2c1a0b'], ['#3d4540', '#7fd13b', '#2a302c'], ['#9a6438', '#e8bf84', '#7a4c28'], ['#e9e4ee', '#ff6ac1', '#cfc8d8']][level] || ['#140a2e', '#ff3b3b', '#2a1a4a'];
  const stukken = toestand === 'menu' ? [{ x: -10, w: W + 20, h: 0 }] : vloer;
  const t = scrollX % 64;
  for (const st of stukken) {
    if (st.x > W || st.x + st.w < 0) continue;
    const y = G - st.h;
    ctx.fillStyle = kleurVloer;
    ctx.fillRect(st.x, y, st.w + 1, H - y);
    ctx.fillStyle = kleurRand;
    ctx.fillRect(st.x, y, st.w + 1, 3);
    ctx.save();
    ctx.beginPath(); ctx.rect(st.x, y, st.w, H - y); ctx.clip();
    ctx.strokeStyle = kleurNaad; ctx.lineWidth = 2;
    for (let x = -t - 64; x < W + 64; x += 64) {
      ctx.beginPath(); ctx.moveTo(x, y + 3); ctx.lineTo(x, y + 32); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 32, y + 32); ctx.lineTo(x + 32, H); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(st.x, y + 32); ctx.lineTo(st.x + st.w, y + 32); ctx.stroke();
    if (level === 4) {
      // zwart-witte tegels, zoals in een kapsalon
      ctx.fillStyle = '#26222b';
      for (let x = -t - 64, k = 0; x < W + 64; x += 32, k++) {
        for (let yy = y + 3, r = 0; yy < H; yy += 32, r++) if ((k + r) % 2) ctx.fillRect(x, yy, 32, 32);
      }
    }
    ctx.restore();
  }
  // gouden randje bij elk opstapje
  for (let i = 1; i < stukken.length; i++) {
    const a = stukken[i - 1], b = stukken[i];
    if (a.h === b.h || b.x < -10 || b.x > W + 10) continue;
    ctx.fillStyle = kleurRand;
    ctx.fillRect(b.x - 2, G - Math.max(a.h, b.h), 3, Math.abs(a.h - b.h) + 3);
  }
}
